[/Script/UnrealEd.EditorPerformanceSettings]
; "Use Less CPU when in Background" lives here (UEditorPerformanceSettings), NOT in EditorPerProjectUserSettings.
; The editor is always in the background while the MCP servers drive it, so it must never throttle itself:
; a throttled editor slows PIE, AirSim physics and capture throughput.
bThrottleCPUWhenNotForeground=False
