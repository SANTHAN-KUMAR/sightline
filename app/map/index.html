<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline C2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Sightline command-and-control map (F15, SOLUTION_DOC §5.9).

  Offline by construction: MapLibre GL JS, the pmtiles protocol and the Protomaps style/fonts/sprites are all
  vendored under app/map/vendor, and the basemap is data/basemap/wayanad.pmtiles. No CDN, no Mapbox token, no
  external host of any kind — app/map/headless_check.mjs runs the page with every non-loopback name
  unresolvable and fails if a single external request is made.

  Run it:
     D:\Tools\uv\uv.exe run python -m sightline.api.serve --port 8781 --demo
     http://127.0.0.1:8781/app/map/index.html
  Add ?selfcheck=1 for the headless verdict (document.title -> MAP_OK / MAP_FAIL).

  GUARDRAIL R10: this page has no delete. "Dismiss" demands a reason, keeps the record, and moves it to its
  own layer. The search-quality raster shows probability of detection, never a "cleared" flag.
-->
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<script src="vendor/pmtiles/pmtiles.js"></script>
<script src="vendor/protomaps-basemaps/basemaps.js"></script>
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --panel2:#222a35; --line:#2f3946; --ink:#e8edf4; --dim:#9aa8b8;
    --human:#e63946; --animal:#3d87c9; --dismissed:#7b8794; --stale:#c98f2d; --ok:#38b26a; --warn:#e0a13a;
    --manual:#ffb545;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  #app{display:grid;grid-template-columns:1fr 372px;height:100%}
  #map{position:relative;height:100%}
  #side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}

  header{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header h1{margin:0 0 6px;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;padding:2px 7px;border-radius:10px;background:#2c3644;border:1px solid var(--line);
        color:var(--dim);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .chip.live{border-color:#2a6b46;color:#a8e6c1}
  .chip.down{border-color:#7a2e2e;color:#f0a8a8}
  .chip.sim{border-color:#7a6220;color:#ffd479;background:#3a2f12}

  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
  .tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
               padding:8px 4px;font:inherit;cursor:pointer}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--human)}
  .pane{flex:1;overflow:auto;padding:8px}
  .pane[hidden]{display:none}

  .rec{border:1px solid var(--line);border-radius:6px;margin-bottom:7px;background:var(--panel2);cursor:pointer}
  .rec:hover{border-color:#4a5568}
  .rec.sel{border-color:var(--human);box-shadow:0 0 0 1px var(--human) inset}
  .rec.dismissed{opacity:.55}
  .rec-top{display:flex;align-items:center;gap:8px;padding:7px 9px}
  .rank{min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-weight:700;
        font-size:12px;color:#fff;flex:none}
  .rec-id{font-weight:600}
  .rec-sub{color:var(--dim);font-size:11px}
  .grow{flex:1}
  .bars{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:0 9px 8px}
  .bars i{display:block;height:100%}
  .why{font-size:11px;color:var(--dim);padding:0 9px 8px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .why b{color:var(--ink);font-weight:600}

  .status-pill{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line);color:var(--dim)}
  .st-confirmed{color:#a8e6c1;border-color:#2a6b46}
  .st-candidate{color:#cfd8e3}
  .st-stale{color:#e8c98c;border-color:#7a6220}
  .st-dismissed{color:#b9c2cc;border-color:#4a5568}

  label.toggle{display:flex;align-items:center;gap:8px;padding:5px 4px;color:var(--dim);cursor:pointer}
  label.toggle input{accent-color:var(--human)}
  .legend{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .legend h3,.pane h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:10px 0 6px}
  .lg{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px;color:var(--dim)}
  .sw{width:16px;height:16px;border-radius:3px;flex:none;border:1px solid #0006}
  .ramp{height:12px;border-radius:3px;flex:1;
        background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)}

  /* MapLibre popup, dark */
  .maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);
      border-radius:8px;padding:0;box-shadow:0 10px 30px #0009;max-width:360px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:18px;padding:2px 7px}
  /* The popup must never run off the bottom of the screen: the score total, the R10 reason box and the
     dismiss button live at its foot, and an operator has to be able to see and reach them. */
  .maplibregl-popup-content{max-height:calc(100vh - 90px);overflow:hidden}
  .pop{width:340px;max-height:calc(100vh - 92px);overflow-y:auto}
  .pop img{width:100%;height:132px;object-fit:cover;display:block;border-radius:7px 7px 0 0;background:#000}
  .pop-body{padding:9px 11px 11px}
  .pop h2{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:7px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:7px 0}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0}
  table.sc{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 2px}
  table.sc th{text-align:left;color:var(--dim);font-weight:500;padding:2px 0}
  table.sc td{text-align:right;font-variant-numeric:tabular-nums;padding:2px 0}
  table.sc tr.tot td,table.sc tr.tot th{border-top:1px solid var(--line);font-weight:700;padding-top:4px}
  .formula{font:11px ui-monospace,Consolas,monospace;color:var(--dim);margin:4px 0 0}
  .act{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .act button,.act input{font:inherit;border-radius:5px;border:1px solid var(--line);background:var(--panel2);
      color:var(--ink);padding:5px 8px}
  .act button{cursor:pointer}
  .act button.danger{border-color:#7a2e2e;color:#ffb3b3}
  .act input{flex:1;min-width:120px}
  .err{color:#ffb3b3;font-size:11px;margin-top:5px;min-height:14px}


  /* ---- F3 pilot HUD (sightline/api/control_feed.py) -------------------------------------------------
     Everything here is driven by the "control" WebSocket message, which the flight loop pushes at 10 Hz.
     The HUD is deliberately an OVERLAY on the map rather than a panel beside it: the point of the demo is
     that a judge flies the aircraft and sees the consequences on the same picture, and a HUD in the corner
     of the map keeps their eyes in one place. It hides itself entirely until a flight pushes control state,
     so a replay or a static review of the map looks exactly as it did before.                          */
  #hud{position:absolute;left:10px;bottom:56px;z-index:4;width:310px;display:none;
       background:#0b0e13e8;border:1px solid var(--line);border-radius:10px;overflow:hidden;
       box-shadow:0 8px 28px #0009;backdrop-filter:blur(3px)}
  #hud.on{display:block}
  #hud.manual{border-color:var(--manual);box-shadow:0 0 0 1px var(--manual) inset,0 8px 28px #0009}
  .hud-top{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#161c25;
           border-bottom:1px solid var(--line)}
  .hud-mode{font-weight:700;font-size:15px;letter-spacing:.06em}
  .m-AUTO{color:var(--ok)} .m-MANUAL{color:var(--manual)} .m-HOLD{color:#c77dff} .m-RTL{color:var(--human)}
  .hud-who{font-size:10.5px;color:var(--dim);line-height:1.25;flex:1}
  .hud-who b{color:var(--ink)}
  /* The idle-hand-back countdown. A ring rather than a number because the thing a judge needs to read at a
     glance, from two metres away, is "how much time have I got", not a decimal.                          */
  .ring{width:38px;height:38px;flex:none;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .bg{stroke:#2a3340} .ring .fg{stroke:var(--manual);transition:stroke-dashoffset .1s linear}
  .ring.soon .fg{stroke:var(--warn)}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}

  .hud-body{padding:9px 11px;display:flex;flex-direction:column;gap:9px}
  .sticks{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .stick{width:62px;height:62px;border:1px solid var(--line);border-radius:8px;position:relative;
         background:#0f141b}
  .stick::before,.stick::after{content:"";position:absolute;background:#232c37}
  .stick::before{left:50%;top:4px;bottom:4px;width:1px}
  .stick::after{top:50%;left:4px;right:4px;height:1px}
  .stick i{position:absolute;width:13px;height:13px;border-radius:7px;background:var(--manual);
           margin:-6.5px 0 0 -6.5px;transition:left .06s linear,top .06s linear;box-shadow:0 0 8px #0006}
  .stick.idle i{background:#46525f}
  .stick label{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--dim)}
  .stickwrap{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:14px}

  .btns{display:flex;flex-wrap:wrap;gap:4px}
  .btn{font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:9px;border:1px solid var(--line);
       color:#6d7b8b;background:#141a22}
  .btn.on{background:var(--manual);border-color:var(--manual);color:#1a1206;font-weight:700}
  .btn.warn{border-color:var(--warn);color:var(--warn)}

  .envelope{font-size:10.5px;color:var(--warn);border:1px solid #5a4415;background:#2a1f08;
            border-radius:6px;padding:4px 7px;display:none}
  .envelope.on{display:block}

  .feed{max-height:118px;overflow:auto;border-top:1px solid var(--line);padding:6px 11px 8px;
        font-size:10.5px;line-height:1.5}
  .feed .ev{display:flex;gap:6px;padding:1px 0}
  .feed .t{color:#5f6b7a;flex:none;font-variant-numeric:tabular-nums}
  .feed .k{flex:none;width:6px;border-radius:3px;background:var(--dim)}
  .ev-mode .k{background:var(--manual)} .ev-mark .k{background:var(--human)}
  .ev-envelope .k{background:var(--warn)} .ev-pad .k{background:#c77dff} .ev-record .k{background:var(--ok)}
  .feed .x{color:var(--ink)} .feed .d{color:var(--dim)}

  /* A takeover is the moment the demo is about, so it gets a full-width flash across the map. */
  #takeover{position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;text-align:center;
            padding:8px;font-weight:700;letter-spacing:.14em;font-size:13px;opacity:0;
            transition:opacity .25s;background:linear-gradient(#ffb54533,#ffb54500);color:var(--manual)}
  #takeover.show{opacity:1}
  /* Pilot marks: the judge's own pins, visually distinct from detections so nobody confuses
     "a human said so" with "the detector said so". */
  .mark-dot{width:15px;height:15px;border-radius:8px;background:#ffd479;border:2px solid #7a5c12;
            box-shadow:0 0 0 3px #ffd47933}
  #banner{position:absolute;left:10px;top:10px;z-index:3;display:flex;gap:6px;align-items:center}
  #status{position:absolute;left:10px;bottom:26px;z-index:3;background:#0b0e13d9;border:1px solid var(--line);
          border-radius:5px;padding:5px 9px;font:11px ui-monospace,Consolas,monospace;white-space:pre;color:var(--dim)}
  .maplibregl-ctrl-attrib{font-size:10px}
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="banner"></div>
    <div id="takeover"></div>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-mode m-AUTO" id="hud-mode">AUTO</div>
        <div class="hud-who" id="hud-who"></div>
        <div class="ring" id="hud-ring" hidden>
          <svg width="38" height="38" viewBox="0 0 38 38">
            <circle class="bg" cx="19" cy="19" r="16" fill="none" stroke-width="3"></circle>
            <circle class="fg" cx="19" cy="19" r="16" fill="none" stroke-width="3"
                    stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="0"></circle>
          </svg>
          <span id="hud-count"></span>
        </div>
      </div>
      <div class="hud-body">
        <div class="sticks">
          <div class="stickwrap">
            <div class="stick idle" id="stick-l"><i></i><label>throttle / yaw</label></div>
          </div>
          <div class="stickwrap">
            <div class="stick idle" id="stick-r"><i></i><label>pitch / roll</label></div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;gap:5px;align-self:flex-start">
            <div class="btns" id="hud-btns"></div>
            <div id="hud-flight" style="font-size:10.5px;color:var(--dim)"></div>
          </div>
        </div>
        <div class="envelope" id="hud-env"></div>
      </div>
      <div class="feed" id="hud-feed"></div>
    </div>
    <div id="status">starting…</div>
  </div>
  <div id="side">
    <header>
      <h1>Sightline &mdash; triage</h1>
      <div class="chips" id="chips"></div>
    </header>
    <div class="tabs" role="tablist">
      <button id="tab-recs" role="tab" aria-selected="true">Records</button>
      <button id="tab-layers" role="tab" aria-selected="false">Layers</button>
    </div>
    <div class="pane" id="pane-recs"></div>
    <div class="pane" id="pane-layers" hidden></div>
  </div>
</div>

<script type="module">
import * as maplibregl from "./vendor/maplibre-gl/maplibre-gl.mjs";

const ORIGIN = location.origin;
const QS = new URLSearchParams(location.search);
const SELFCHECK = QS.get("selfcheck") === "1";
const CENTER = [Number(QS.get("lon") ?? 76.1450), Number(QS.get("lat") ?? 11.4870)];
const T0 = performance.now();
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), chipsEl = $("chips"), paneRecs = $("pane-recs"), paneLayers = $("pane-layers");

const CLASS_COLOR = { human: "#e63946", animal: "#3d87c9" };
const DISMISSED = "#7b8794";
const state = {
  records: new Map(), selected: null, ws: null, wsState: "connecting", outbox: null,
  coverage: null, coverageLoaded: false, covLayer: QS.get("layer") || "", cannotClear: 0,
  mission: null, domain: null, errors: [], lastSeq: 0,
  //: The F3 pilot feed. Null until a flight pushes one, which is what keeps the HUD hidden on a map that
  //: is only being reviewed rather than flown.
  control: null, marks: [],
};
// Exposed for app/map/headless_check.mjs (and for a console poke); nothing in the page reads it back.
window.__sightlineState = state;

// --- WGS-84 metres-per-degree (matches sightline/common/geodesy.py; the h_acc ring must be metre-true) ---
const A = 6378137.0, E2 = (1 / 298.257223563) * (2 - 1 / 298.257223563);
function metresPerDeg(lat) {
  const s = Math.sin(lat * Math.PI / 180), w = 1 - E2 * s * s;
  return { lat: (Math.PI / 180) * A * (1 - E2) / Math.pow(w, 1.5),
           lon: (Math.PI / 180) * (A / Math.sqrt(w)) * Math.cos(lat * Math.PI / 180) };
}
function circlePolygon(lon, lat, radiusM, n = 64) {
  const m = metresPerDeg(lat), ring = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    ring.push([lon + (radiusM / m.lon) * Math.cos(a), lat + (radiusM / m.lat) * Math.sin(a)]);
  }
  return { type: "Polygon", coordinates: [ring] };
}
const EMPTY = { type: "FeatureCollection", features: [] };

// --- basemap style (copied from the verified verify_offline.html) ----------------------------------------
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const style = {
  version: 8,
  glyphs: `${ORIGIN}/app/map/vendor/basemaps-assets/fonts/{fontstack}/{range}.pbf`,
  sprite: `${ORIGIN}/app/map/vendor/basemaps-assets/sprites/v4/dark`,
  sources: {
    protomaps: {
      type: "vector",
      url: `pmtiles://${ORIGIN}/data/basemap/wayanad.pmtiles`,
      attribution: '<a href="https://protomaps.com">Protomaps</a> &copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
    },
  },
  layers: basemaps.layers("protomaps", basemaps.namedFlavor("dark"), { lang: "en" }),
};

const map = new maplibregl.Map({
  container: "map", style, center: CENTER, zoom: Number(QS.get("z") ?? 14.4),
  attributionControl: { compact: false }, hash: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 140, unit: "metric" }), "bottom-left");
map.on("error", (e) => state.errors.push(String(e.error?.message || e.error || e)));

// --- diagonal hatch for "aerial search cannot clear" (§5.9) ---------------------------------------------
function hatchImage(size = 8, color = "#ff6b6b") {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.clearRect(0, 0, size, size);
  g.strokeStyle = color;
  g.lineWidth = 2;
  g.lineCap = "square";
  g.beginPath();
  // 45-degree lines with period `size` in x tile seamlessly in both directions.
  for (const off of [-size, 0, size]) { g.moveTo(off, size); g.lineTo(off + size, 0); }
  g.stroke();
  return g.getImageData(0, 0, size, size);
}

// --- layer construction --------------------------------------------------------------------------------
// size = rank (rank 1 is biggest), colour = class, ring = h_acc_m.
const RANK_RADIUS = ["case", ["<", ["get", "priority_rank"], 0], 5,
  ["interpolate", ["linear"], ["get", "priority_rank"], 1, 13, 4, 9, 10, 6, 25, 4.5]];
const CLASS_PAINT = ["match", ["get", "cls"], "animal", CLASS_COLOR.animal, CLASS_COLOR.human];
const NOT_DISMISSED = ["!=", ["get", "status"], "dismissed"];
const IS_DISMISSED = ["==", ["get", "status"], "dismissed"];

function addLayers() {
  const firstSymbol = (map.getStyle().layers || []).find((l) => l.type === "symbol")?.id;
  state.firstSymbol = firstSymbol;  // overlays go UNDER the basemap's place labels
  map.addImage("cannot-clear-hatch", hatchImage());

  map.addSource("cannot-clear", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "cannot-clear-base", type: "fill", source: "cannot-clear",
    paint: { "fill-color": "#ff6b6b", "fill-opacity": 0.16 } }, firstSymbol);
  map.addLayer({ id: "cannot-clear-fill", type: "fill", source: "cannot-clear",
    paint: { "fill-pattern": "cannot-clear-hatch", "fill-opacity": 0.85 } }, firstSymbol);
  map.addLayer({ id: "cannot-clear-line", type: "line", source: "cannot-clear",
    paint: { "line-color": "#ff6b6b", "line-width": 1.6, "line-opacity": 0.95 } }, firstSymbol);

  map.addSource("plan", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "plan-line", type: "line", source: "plan",
    filter: ["==", ["geometry-type"], "LineString"],
    paint: { "line-color": "#7fd1ff", "line-width": 1.6, "line-dasharray": [3, 2], "line-opacity": 0.75 } });
  map.addLayer({ id: "plan-wp", type: "circle", source: "plan",
    filter: ["==", ["geometry-type"], "Point"],
    paint: { "circle-radius": 2.6, "circle-color": "#7fd1ff", "circle-opacity": 0.8 } });

  map.addSource("track", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "track-line", type: "line", source: "track",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-width": 2.6,
      "line-color": ["match", ["get", "mode"], "MANUAL", "#ffb545", "HOLD", "#c77dff", "RTL", "#ff6b6b", "#57e08a"],
      "line-opacity": 0.95 } });

  map.addSource("footprint", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "footprint-fill", type: "fill", source: "footprint",
    paint: { "fill-color": "#ffd479", "fill-opacity": 0.16 } });
  map.addLayer({ id: "footprint-line", type: "line", source: "footprint",
    paint: { "line-color": "#ffd479", "line-width": 1.8, "line-opacity": 0.95 } });

  map.addSource("rings", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "acc-ring-fill", type: "fill", source: "rings", filter: NOT_DISMISSED,
    paint: { "fill-color": CLASS_PAINT, "fill-opacity": 0.10 } });
  map.addLayer({ id: "acc-ring-line", type: "line", source: "rings", filter: NOT_DISMISSED,
    paint: { "line-color": CLASS_PAINT, "line-width": 1.6, "line-opacity": 0.8,
             "line-dasharray": [2, 2] } });

  // Pilot marks (F3): gold, ringed, labelled with the press order. Deliberately unlike a detection pin -
  // the demo must never let "a judge pointed at this" read as "the detector found this".
  map.addSource("marks", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "mark-halo", type: "circle", source: "marks",
                 paint: { "circle-radius": 13, "circle-color": "#ffd479", "circle-opacity": 0.18,
                          "circle-stroke-color": "#ffd479", "circle-stroke-width": 1,
                          "circle-stroke-opacity": 0.5 } });
  map.addLayer({ id: "mark-dot", type: "circle", source: "marks",
                 paint: { "circle-radius": 6, "circle-color": "#ffd479",
                          "circle-stroke-color": "#5b4310", "circle-stroke-width": 2 } });
  map.addLayer({ id: "mark-label", type: "symbol", source: "marks",
                 layout: { "text-field": ["concat", "M", ["to-string", ["get", "idx"]]],
                           "text-font": ["Noto Sans Regular"], "text-size": 10,
                           "text-offset": [0, -1.5], "text-allow-overlap": true },
                 paint: { "text-color": "#ffd479", "text-halo-color": "#0b0e13", "text-halo-width": 1.4 } });

  map.addSource("records", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "markers-dismissed", type: "circle", source: "records", filter: IS_DISMISSED,
    paint: { "circle-radius": 5, "circle-color": "rgba(0,0,0,0)", "circle-stroke-width": 1.6,
             "circle-stroke-color": DISMISSED, "circle-opacity": 1 } });
  map.addLayer({ id: "markers", type: "circle", source: "records", filter: NOT_DISMISSED,
    paint: { "circle-radius": RANK_RADIUS, "circle-color": CLASS_PAINT,
             "circle-stroke-width": ["case", ["==", ["get", "status"], "confirmed"], 2.2, 1.2],
             "circle-stroke-color": "#ffffff",
             "circle-opacity": ["case", ["==", ["get", "status"], "stale"], 0.55, 0.95] } });
  map.addLayer({ id: "marker-rank", type: "symbol", source: "records", filter: NOT_DISMISSED,
    layout: { "text-field": ["case", ["<", ["get", "priority_rank"], 0], "?",
                             ["to-string", ["get", "priority_rank"]]],
              "text-font": ["Noto Sans Medium"], "text-size": 11, "text-allow-overlap": true },
    paint: { "text-color": "#ffffff", "text-halo-color": "#000", "text-halo-width": 1 } });

  map.addSource("drone", { type: "geojson", data: EMPTY });
  // The halo is deliberately smaller than the camera footprint: at survey altitude the footprint is only
  // ~85 x 48 m, and a fat halo swallows it (it did, in the first render of this page).
  map.addLayer({ id: "drone-halo", type: "circle", source: "drone",
    paint: { "circle-radius": 8, "circle-color": "#ffd479", "circle-opacity": 0.16,
             "circle-stroke-color": "#ffd479", "circle-stroke-width": 1 } });
  map.addLayer({ id: "drone-dot", type: "circle", source: "drone",
    paint: { "circle-radius": 4.2, "circle-color": "#ffd479", "circle-stroke-color": "#241c05",
             "circle-stroke-width": 1.6 } });

  for (const id of ["markers", "markers-dismissed"]) {
    map.on("click", id, (e) => openRecord(e.features[0].properties.record_id));
    map.on("mouseenter", id, () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", id, () => (map.getCanvas().style.cursor = ""));
  }

  // The plan lane states WHY each leg exists in the waypoint's `reason`; show it rather than hide it.
  map.on("click", "plan-wp", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true, offset: 10 })
      .setLngLat(e.lngLat)
      .setHTML(`<div class="pop-body" style="width:280px"><h2>waypoint ${p.seq ?? "?"} · ${p.action || "goto"}</h2>
        <div class="rec-sub">${fmt(p.agl_m, 0)} m AGL · ${fmt(p.speed_ms, 1)} m/s · gimbal ${fmt(p.gimbal_pitch_deg, 0)}°
        · segment ${p.segment_id || "—"} · pass ${p.pass_id ?? "—"}</div>
        <p class="formula">${p.reason || ""}</p></div>`)
      .addTo(map);
  });
  map.on("mouseenter", "plan-wp", () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", "plan-wp", () => (map.getCanvas().style.cursor = ""));

  // The "aerial search cannot clear" polygons must say so when clicked (R10, §2.7).
  map.on("click", "cannot-clear-fill", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true, offset: 6 })
      .setLngLat(e.lngLat)
      .setHTML(`<div class="pop-body" style="width:270px"><h2 style="color:#ff9b9b">${p.label || "aerial search cannot clear"}</h2>
        <p class="formula">POD is held at 0 inside this polygon no matter how much it is overflown.
        It is never "cleared"; clearing it needs ground search, canine or radar (§2.7, R10).</p>
        <div class="rec-sub">domain ${p.domain || "?"}${p.reason ? " · " + p.reason : ""}</div></div>`)
      .addTo(map);
  });
}

// --- data plumbing -------------------------------------------------------------------------------------
function upsert(feature) {
  state.records.set(feature.id ?? feature.properties.record_id, feature);
  if (state.domain === null) state.domain = feature.properties?.source?.domain ?? null;
}
function renderRecords() {
  const feats = [...state.records.values()];
  map.getSource("records")?.setData({ type: "FeatureCollection", features: feats });
  map.getSource("rings")?.setData({
    type: "FeatureCollection",
    features: feats.map((f) => ({
      type: "Feature", id: f.id, properties: f.properties,
      geometry: circlePolygon(f.geometry.coordinates[0], f.geometry.coordinates[1],
                              Math.max(0.5, f.properties.h_acc_m || 0)),
    })),
  });
  renderList(feats);
  renderChips();
}

async function loadRecords() {
  const r = await fetch("/api/records.geojson");
  if (!r.ok) throw new Error(`records ${r.status}`);
  const fc = await r.json();
  state.records.clear();
  fc.features.forEach(upsert);
  renderRecords();
  return fc.features.length;
}

// The sidecar is sightline/api/coverage_feed.py's normalisation of the coverage lane's own coverage.json
// (product "sightline.coverage"): one entry per presentation layer, each with an API image/geojson URL,
// its k and — crucially — whether that k was MEASURED. Today it never is, and the page says so.
function covLayerEntry() {
  const side = state.coverage;
  if (!side?.layers?.length) return null;
  return side.layers.find((l) => l.layer === state.covLayer) || side.layers[0];
}

async function loadCoverage() {
  const r = await fetch("/api/coverage/overlay.json");
  if (!r.ok) { setStatus(); return false; }
  const side = await r.json();
  state.coverage = side;
  if (!side.layers?.length) { state.errors.push("coverage sidecar has no layers"); return false; }
  if (!side.layers.some((l) => l.layer === state.covLayer)) state.covLayer = side.default_layer || side.layers[0].layer;
  const entry = covLayerEntry();
  await new Promise((res) => {
    const img = new Image();
    img.onload = () => { state.coverageLoaded = true; res(); };
    img.onerror = () => { state.errors.push("coverage raster failed to load: " + entry.image_url); res(); };
    img.src = entry.image_url;
  });
  if (state.coverageLoaded) {
    // The image source is created only once a real raster exists: MapLibre rejects a degenerate placeholder.
    if (map.getSource("coverage")) {
      map.getSource("coverage").updateImage({ url: entry.image_url, coordinates: side.coordinates });
    } else {
      map.addSource("coverage", { type: "image", url: entry.image_url, coordinates: side.coordinates });
      const under = map.getLayer("cannot-clear-base") ? "cannot-clear-base" : state.firstSymbol;
      map.addLayer({ id: "coverage-pod", type: "raster", source: "coverage",
        paint: { "raster-opacity": 0.72, "raster-resampling": "nearest" } }, under);
    }
  }
  // The burial polygons: the coverage PNG is transparent over them, so this hatch is what fills the hole.
  const cc = await fetch("/api/coverage/cannot_clear.geojson?layer=" + encodeURIComponent(state.covLayer));
  if (cc.ok) {
    const fc = await cc.json();
    state.cannotClear = fc.features.length;
    map.getSource("cannot-clear").setData(fc);
  }
  renderLayerPane();
  renderChips();
  return state.coverageLoaded;
}

async function setCoverageLayer(name) {
  state.covLayer = name;
  state.coverageLoaded = false;
  await loadCoverage();
  setStatus();
}

async function loadMission() {
  const r = await fetch("/api/mission");
  if (!r.ok) return false;
  applyMission(await r.json());
  return true;
}
function applyMission(m) {
  state.mission = m;
  map.getSource("track")?.setData(m.track || EMPTY);
  map.getSource("plan")?.setData(m.plan || EMPTY);
  map.getSource("footprint")?.setData(m.footprint ? { type: "FeatureCollection", features: [m.footprint] } : EMPTY);
  map.getSource("drone")?.setData(m.drone ? { type: "FeatureCollection", features: [m.drone] } : EMPTY);
  renderChips();
}

// --- live feed (see sightline/api/live.py for the message format) ---------------------------------------
function connectWS() {
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
  let ws;
  try { ws = new WebSocket(url); } catch { state.wsState = "down"; return; }
  state.ws = ws;
  ws.onopen = () => { state.wsState = "live"; renderChips(); };
  ws.onclose = () => { state.wsState = "down"; renderChips(); setTimeout(connectWS, 3000); };
  ws.onerror = () => { state.wsState = "down"; renderChips(); };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    state.lastSeq = m.seq ?? state.lastSeq;
    if (m.type === "snapshot") { state.records.clear(); (m.records?.features || []).forEach(upsert); renderRecords(); }
    else if (m.type === "record") { upsert(m.feature); renderRecords(); if (state.selected === m.feature.id) openRecord(m.feature.id, true); }
    else if (m.type === "mission") applyMission(m);
    else if (m.type === "coverage") loadCoverage();
    else if (m.type === "outbox") { state.outbox = m; renderChips(); }
    else if (m.type === "control") applyControl(m);
  };
}

// --- F3 pilot HUD ---------------------------------------------------------------------------------------
// Fed by the "control" WebSocket message (sightline/api/control_feed.py). Everything below is presentation:
// the HUD never commands anything, and there is no control path from this page to the aircraft. A judge
// flies with the pad; this is the window they and the room watch while they do it.
const hud = {
  el: document.getElementById("hud"),
  mode: document.getElementById("hud-mode"),
  who: document.getElementById("hud-who"),
  ring: document.getElementById("hud-ring"),
  count: document.getElementById("hud-count"),
  btns: document.getElementById("hud-btns"),
  flight: document.getElementById("hud-flight"),
  env: document.getElementById("hud-env"),
  feed: document.getElementById("hud-feed"),
  stickL: document.getElementById("stick-l"),
  stickR: document.getElementById("stick-r"),
  flash: document.getElementById("takeover"),
  events: [],
  lastMode: null,
  seq: 0,
};

const RING_LEN = 2 * Math.PI * 16;   // matches stroke-dasharray in the markup

function hudStick(box, x, y) {
  // x and y are -1..1 with +x right and +y UP, which is how a person describes a stick. The dot is placed
  // in CSS percentages so the widget can be resized without touching this.
  const dot = box.querySelector("i");
  dot.style.left = `${50 + Math.max(-1, Math.min(1, x)) * 42}%`;
  dot.style.top = `${50 - Math.max(-1, Math.min(1, y)) * 42}%`;
  box.classList.toggle("idle", Math.hypot(x, y) < 0.06);
}

function applyControl(c) {
  state.control = c;
  hud.el.classList.add("on");
  const mode = c.mode || "AUTO";
  hud.el.classList.toggle("manual", mode === "MANUAL");
  hud.mode.className = `hud-mode m-${mode}`;
  hud.mode.textContent = mode;

  // Who is flying, and can we trust the buttons?
  const pad = c.pad || {};
  const verified = pad.verified === true;
  const padName = pad.device || pad.source || "no controller";
  hud.who.innerHTML = pad.attached
    ? `<b>${escapeHtml(padName)}</b><br>${verified
        ? "mapping measured"
        : `<span style="color:var(--warn)">buttons unverified</span>`}`
    : `<span style="color:var(--dim)">no controller — the mission is flying itself</span>`;

  // The idle-hand-back countdown. Shown only while it can actually fire, so it never sits at a frozen 0.
  const rem = c.idle_remaining_s, total = c.idle_resume_s || 0;
  if (rem === null || rem === undefined || total <= 0) {
    hud.ring.hidden = true;
  } else {
    hud.ring.hidden = false;
    const frac = Math.max(0, Math.min(1, rem / total));
    hud.ring.querySelector(".fg").style.strokeDashoffset = String(RING_LEN * (1 - frac));
    hud.ring.classList.toggle("soon", rem <= 4);
    hud.count.textContent = String(Math.ceil(rem));
    hud.count.title = `hands back to AUTO in ${rem.toFixed(1)} s of no input`;
  }

  const st = c.sticks || {};
  // throttle arrives 0..1 centred at 0.5; the widget wants -1..1.
  hudStick(hud.stickL, st.yaw ?? 0, ((st.throttle ?? 0.5) - 0.5) * 2);
  hudStick(hud.stickR, st.roll ?? 0, st.pitch ?? 0);

  const order = ["takeover", "resume", "hold", "rtl", "mark", "boost", "orbit", "freefly", "camera"];
  const b = c.buttons || {};
  hud.btns.innerHTML = order.filter((k) => k in b)
    .map((k) => `<span class="btn ${b[k] ? "on" : ""}">${k}</span>`).join("")
    || `<span class="btn warn">no buttons reported</span>`;

  const f = c.flight || {}, s2 = c.stats || {};
  const bits = [];
  if (f.agl_m !== null && f.agl_m !== undefined) bits.push(`${fmt(f.agl_m, 0)} m AGL`);
  if (f.boost) bits.push(`<b style="color:var(--manual)">BOOST</b>`);
  if (f.orbit) bits.push(`<b style="color:#c77dff">ORBIT</b>`);
  if (c.free_flight) bits.push(`<b style="color:var(--manual)">FREE FLIGHT</b>`);
  if (f.manual_mode === "rc") bits.push(`<b style="color:var(--warn)">RC passthrough</b>`);
  if (s2.marks) bits.push(`${s2.marks} mark${s2.marks === 1 ? "" : "s"}`);
  const sbm = s2.seconds_by_mode || {};
  if (sbm.MANUAL) bits.push(`${fmt(sbm.MANUAL, 0)} s flown by hand`);
  hud.flight.innerHTML = bits.join(" · ");

  const env = c.envelope || {};
  hud.env.classList.toggle("on", !!env.any);
  if (env.any) hud.env.textContent = (env.reasons || []).join(" · ") || "held by the flight envelope";

  if (c.marks && map.getSource("marks")) map.getSource("marks").setData(c.marks);

  for (const ev of (c.events || [])) {
    if (ev.seq <= hud.seq) continue;
    hud.seq = ev.seq;
    hud.events.push(ev);
  }
  if (hud.events.length > 60) hud.events = hud.events.slice(-60);
  hud.feed.innerHTML = hud.events.slice().reverse().map((ev) => {
    const t = new Date((ev.t_utc || 0) * 1000).toLocaleTimeString([], { hour12: false });
    return `<div class="ev ev-${escapeHtml(ev.kind || "note")}"><span class="k"></span>` +
           `<span class="t">${t}</span><span class="x">${escapeHtml(ev.text || "")}` +
           (ev.detail ? ` <span class="d">${escapeHtml(ev.detail)}</span>` : "") + `</span></div>`;
  }).join("");

  if (mode !== hud.lastMode) {
    if (hud.lastMode !== null) flashMode(hud.lastMode, mode);
    hud.lastMode = mode;
    renderChips();
  }
}

function flashMode(from, to) {
  const text = to === "MANUAL" ? "JUDGE HAS CONTROL"
    : (from === "MANUAL" && to === "AUTO") ? "MISSION RESUMED"
    : to === "RTL" ? "RETURNING TO LAUNCH"
    : to === "HOLD" ? "HOLDING POSITION" : `${from} → ${to}`;
  hud.flash.textContent = text;
  hud.flash.classList.add("show");
  clearTimeout(hud._flashT);
  hud._flashT = setTimeout(() => hud.flash.classList.remove("show"), 2200);
}

function escapeHtml(x) {
  return String(x).replace(/[&<>"']/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}

async function pollOutbox() {
  try {
    const r = await fetch("/api/outbox");
    if (r.ok) { state.outbox = await r.json(); renderChips(); }
  } catch { /* offline is a normal state here */ }
}

// --- side panel ----------------------------------------------------------------------------------------
function pill(status) { return `<span class="status-pill st-${status}">${status}</span>`; }
function fmt(n, d = 2) { return (n === null || n === undefined) ? "—" : Number(n).toFixed(d); }

function renderChips() {
  const feats = [...state.records.values()];
  const by = (s) => feats.filter((f) => f.properties.status === s).length;
  const ob = state.outbox;
  const live = state.wsState === "live";
  const parts = [
    `<span class="chip ${live ? "live" : "down"}"><b>${live ? "LIVE" : "NO FEED"}</b> ws</span>`,
    `<span class="chip"><b>${feats.length}</b> records</span>`,
    `<span class="chip"><b>${by("confirmed")}</b> confirmed</span>`,
    `<span class="chip"><b>${by("candidate")}</b> candidate</span>`,
    `<span class="chip"><b>${by("dismissed")}</b> dismissed</span>`,
  ];
  if (ob) parts.push(`<span class="chip ${ob.online === false ? "down" : ""}">outbox <b>${ob.depth ?? 0}</b>${ob.online === false ? " · link down" : ""}</span>`);
  const cl = covLayerEntry();
  if (cl) {
    const s = cl.stats || {};
    parts.push(`<span class="chip">POD <b>${cl.layer}</b> mean <b>${fmt(s.mean_pod)}</b> · ≥0.5 in <b>${s["cells_pod_ge_0.5"] ?? "—"}</b> cells</span>`);
    parts.push(`<span class="chip ${cl.k_is_measured ? "" : "sim"}">k ${cl.k === null ? "n/a" : fmt(cl.k, 2)} · <b>${cl.k_is_measured ? "measured" : "MODELLED"}</b></span>`);
    if (state.cannotClear) parts.push(`<span class="chip down"><b>${state.cannotClear}</b> cannot-clear areas</span>`);
  }
  const cmode = state.control?.mode;
  if (cmode) {
    const cls = cmode === "MANUAL" ? "sim" : cmode === "AUTO" ? "live" : "";
    parts.push(`<span class="chip ${cls}">mode <b>${cmode}</b>${state.control.free_flight ? " · FREE" : ""}</span>`);
  } else if (state.mission?.drone) {
    parts.push(`<span class="chip">mode <b>${state.mission.drone.properties.mode}</b></span>`);
  }
  if (state.mission?.drone) parts.push(`<span class="chip">${fmt(state.mission.drone.properties.agl_m, 0)} m AGL</span>`);
  if (state.domain === "sim") parts.push(`<span class="chip sim"><b>SIM</b> simulated data</span>`);
  chipsEl.innerHTML = parts.join("");
}

function renderList(feats) {
  const sorted = [...feats].sort((a, b) => {
    const ra = a.properties.priority_rank, rb = b.properties.priority_rank;
    const ka = ra < 0 ? 1e9 : ra, kb = rb < 0 ? 1e9 : rb;
    return ka - kb;
  });
  paneRecs.innerHTML = sorted.map((f) => {
    const p = f.properties, c = p.score_components || {}, dis = p.status === "dismissed";
    const col = dis ? DISMISSED : (CLASS_COLOR[p.cls] || CLASS_COLOR.human);
    const terms = [["p_living", c.p_living, "#e63946"], ["w_class", c.w_class, "#f2a65a"],
                   ["urgency", c.urgency / 2.5, "#8ac6d1"], ["count", (c.count_bonus - 1) * 5, "#9d8df1"]];
    const bars = terms.map(([, v, cc]) =>
      `<i style="flex:${Math.max(0.02, Math.min(1, v || 0))};background:${cc}"></i>`).join("");
    return `<div class="rec ${dis ? "dismissed" : ""} ${state.selected === f.id ? "sel" : ""}" data-id="${f.id}">
      <div class="rec-top">
        <span class="rank" style="background:${col}">${p.priority_rank < 0 ? "?" : p.priority_rank}</span>
        <span>
          <span class="rec-id">${f.id}</span> ${pill(p.status)}<br>
          <span class="rec-sub">${p.cls} · ${c.urgency_class || "unknown"} · ${p.count_estimate}× · ±${fmt(p.h_acc_m, 1)} m</span>
        </span>
        <span class="grow"></span>
        <span style="text-align:right"><b>${fmt(p.score, 2)}</b><br><span class="rec-sub">score</span></span>
      </div>
      <div class="bars">${bars}</div>
      <div class="why">
        <span>P(living) <b>${fmt(c.p_living)}</b></span><span>w_class <b>${fmt(c.w_class)}</b></span>
        <span>urgency <b>${fmt(c.urgency)}</b></span><span>count× <b>${fmt(c.count_bonus)}</b></span>
        <span>${p.thermal_hot ? "thermal ✓" : "thermal ✗"}</span><span>${p.motion_state}</span>
      </div>
    </div>`;
  }).join("") || `<p style="color:var(--dim)">No records yet.</p>`;
  paneRecs.querySelectorAll(".rec").forEach((el) =>
    el.addEventListener("click", () => openRecord(el.dataset.id, false, true)));
}

let popup = null;
function openRecord(id, keepView = false, fly = false) {
  const f = state.records.get(id);
  if (!f) return;
  state.selected = id;
  const p = f.properties, c = p.score_components || {}, ev = (p.evidence || [])[0];
  const col = p.status === "dismissed" ? DISMISSED : (CLASS_COLOR[p.cls] || CLASS_COLOR.human);
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = `
    ${ev?.thumb_uri ? `<img src="${ev.thumb_uri}" alt="evidence crop">` : ""}
    <div class="pop-body">
      <h2><span class="rank" style="background:${col};min-width:22px;height:22px">${p.priority_rank < 0 ? "?" : p.priority_rank}</span>
          ${f.id} ${pill(p.status)}</h2>
      <div class="rec-sub">${p.cls} · ${c.urgency_class || "unknown"} · ${p.posture} · ${p.submersion}${p.posture_promoted ? " · posture-promoted" : ""}</div>
      <table class="sc">
        <tr><th>P(living | record)</th><td>${fmt(c.p_living, 3)}</td></tr>
        <tr><th>w_class(t) &nbsp;<span class="rec-sub">t+${fmt(c.elapsed_h, 1)} h</span></th><td>× ${fmt(c.w_class, 3)}</td></tr>
        <tr><th>urgency_class</th><td>× ${fmt(c.urgency, 3)}</td></tr>
        <tr><th>1 + 0.1·count &nbsp;<span class="rec-sub">${p.count_estimate} (${p.count_min}–${p.count_max})</span></th><td>× ${fmt(c.count_bonus, 3)}</td></tr>
        <tr class="tot"><th>priority score</th><td>${fmt(p.score, 3)}</td></tr>
      </table>
      <p class="formula">score = P(living) × w_class(t) × urgency × (1 + 0.1·count)<br>
         thermal boost ${fmt(c.thermal_boost, 2)} · motion boost ${fmt(c.motion_boost, 2)}</p>
      <div class="rec-sub" style="margin:6px 0">±${fmt(p.h_acc_m, 1)} m (1σ) · CE90 ${fmt(p.ce90_m, 1)} m ·
        ${p.n_observations} obs · ${p.thermal_hot ? `thermal ${fmt(p.thermal_c, 1)} °C` : "no thermal"}</div>
      <div class="act">
        <button data-act="confirmed">Confirm</button>
        <button data-act="stale">Mark stale</button>
      </div>
      <div class="act">
        <input id="dismiss-reason" placeholder="reason (required to dismiss)" value="${p.dismissed_reason || ""}">
        <button class="danger" data-act="dismiss">Dismiss</button>
      </div>
      <div class="err" id="act-err"></div>
      <p class="formula">R10: dismissing keeps the record and its history; nothing is ever deleted.</p>
      <details ${p.dismissed_reason ? "open" : ""}><summary class="rec-sub">all fields</summary>
      <dl class="kv">
        <dt>position</dt><dd>${f.geometry.coordinates[1].toFixed(6)}, ${f.geometry.coordinates[0].toFixed(6)}</dd>
        <dt>accuracy</dt><dd>±${fmt(p.h_acc_m, 1)} m (1σ) · CE90 ${fmt(p.ce90_m, 1)} m · ${p.method}</dd>
        <dt>confidence</dt><dd>${fmt(p.confidence, 3)} fused · ${fmt(p.confidence_max_det, 3)} best det</dd>
        <dt>observations</dt><dd>${p.n_observations} in ${p.n_tracks_merged} track(s), passes [${(p.seen_in_passes || []).join(", ")}]</dd>
        <dt>motion</dt><dd>${p.motion_state} · ${fmt(p.motion_displacement_m, 1)} m / ${fmt(p.motion_window_s, 0)} s</dd>
        <dt>thermal</dt><dd>${p.thermal_hot ? `hot ${fmt(p.thermal_c, 1)} °C` : "no thermal agreement"} · ${p.modality}</dd>
        <dt>size</dt><dd>${fmt(p.pixel_size_px, 0)} px · GSD ${fmt(p.gsd_cm_px, 1)} cm/px · occl ${p.occlusion ?? "—"}</dd>
        <dt>version</dt><dd>v${p.version} · ${p.schema_version} · <a href="/api/records/${encodeURIComponent(f.id)}/history" target="_blank">history</a></dd>
        ${ev ? `<dt>evidence</dt><dd>${ev.clip_id} frame ${ev.frame_idx} · conf ${fmt(ev.det_conf, 2)} · ${ev.camera}</dd>` : ""}
        ${p.dismissed_reason ? `<dt>dismissed</dt><dd>${p.dismissed_reason} — ${p.dismissed_by}</dd>` : ""}
        ${p.notes ? `<dt>notes</dt><dd>${p.notes}</dd>` : ""}
      </dl></details>
    </div>`;
  el.querySelectorAll("button[data-act]").forEach((b) =>
    b.addEventListener("click", () => act(id, b.dataset.act, el)));

  popup?.remove();
  popup = new maplibregl.Popup({ closeButton: true, maxWidth: "360px", offset: 14 })
    .setLngLat(f.geometry.coordinates.slice(0, 2)).setDOMContent(el).addTo(map);
  // offset lifts the marker above centre so the popup (score table + R10 controls) has room below it
  if (fly && !keepView) map.flyTo({ center: f.geometry.coordinates.slice(0, 2), zoom: Math.max(map.getZoom(), 15),
                                    offset: [0, -140], speed: 1.4 });
  renderList([...state.records.values()]);
}

async function act(id, what, el) {
  const errEl = el.querySelector("#act-err");
  errEl.textContent = "";
  try {
    let r;
    if (what === "dismiss") {
      const reason = el.querySelector("#dismiss-reason").value.trim();
      if (!reason) { errEl.textContent = "R10: a dismissal needs a reason."; return; }
      r = await fetch(`/api/records/${encodeURIComponent(id)}/dismiss`,
        { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ reason, by: "operator" }) });
    } else {
      r = await fetch(`/api/records/${encodeURIComponent(id)}/status`,
        { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ status: what, actor: "operator" }) });
    }
    const j = await r.json();
    if (!r.ok) { errEl.textContent = j.detail || `HTTP ${r.status}`; return; }
    upsert(j.feature); renderRecords(); openRecord(id, true);
  } catch (e) { errEl.textContent = String(e); }
}

// --- layer panel ---------------------------------------------------------------------------------------
const TOGGLES = [
  ["Search quality (POD)", ["coverage-pod"], true],
  ["Aerial search cannot clear", ["cannot-clear-base", "cannot-clear-fill", "cannot-clear-line"], true],
  ["Triage markers", ["markers", "marker-rank", "acc-ring-fill", "acc-ring-line"], true],
  ["Dismissed records", ["markers-dismissed"], true],
  ["Planned pattern", ["plan-line", "plan-wp"], true],
  ["Flight track", ["track-line"], true],
  ["Camera footprint", ["footprint-fill", "footprint-line"], true],
  ["Drone", ["drone-halo", "drone-dot"], true],
];
function rampCss() {
  const stops = state.coverage?.ramp;
  if (!stops?.length) return "linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)";
  const parts = stops.map((s) => `rgb(${s.rgb.join(",")}) ${(s.pod * 100).toFixed(0)}%`);
  return `linear-gradient(90deg,${parts.join(",")})`;
}

function renderLayerPane() {
  const side = state.coverage, cl = covLayerEntry();
  const presPicker = side?.layers?.length
    ? `<h3>Presentation layer (§5.3b)</h3>` + side.layers.map((l) =>
        `<label class="toggle"><input type="radio" name="covlayer" value="${l.layer}" ${l.layer === state.covLayer ? "checked" : ""}>
           ${l.layer} <span class="rec-sub">mean POD ${fmt(l.stats?.mean_pod)}</span></label>`).join("")
    : "";
  paneLayers.innerHTML = `<h3>Layers</h3>` + TOGGLES.map(([label, ids, on], i) =>
    `<label class="toggle"><input type="checkbox" data-i="${i}" ${on ? "checked" : ""}> ${label}</label>`).join("") +
    presPicker +
    `<div class="legend">
      <h3>Triage markers</h3>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.human}"></span> human — size is priority rank</div>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.animal}"></span> animal</div>
      <div class="lg"><span class="sw" style="background:transparent;border:1.5px solid ${DISMISSED}"></span> dismissed (kept, R10)</div>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.human}22;border-color:${CLASS_COLOR.human}"></span> ring = h_acc_m (1σ)</div>
      <h3>Search quality</h3>
      <div class="lg"><span class="ramp" style="background:${rampCss()}"></span></div>
      <div class="lg" style="justify-content:space-between"><span>POD 0</span><span>POD ${side?.bands ? fmt(side.bands[side.bands.length - 2], 2) : "1"}+</span></div>
      <div class="lg">unshaded = never swept · hatched = ${side?.cannot_clear_label || "aerial search cannot clear"}</div>
      ${cl ? `<div class="lg" style="display:block">k = ${cl.k === null ? "n/a (mixture)" : fmt(cl.k, 3)},
        <b style="color:${cl.k_is_measured ? "var(--ok)" : "var(--warn)"}">${cl.k_is_measured ? "measured" : "modelled, NOT measured"}</b><br>
        <span class="rec-sub">${cl.k_basis || ""}</span></div>` : ""}
      ${side?.legend_note ? `<div class="lg" style="display:block"><span class="rec-sub">${side.legend_note}</span></div>` : ""}
      ${side ? `<div class="lg"><span class="rec-sub">domain <b>${side.domain}</b> · ${side.passes?.length || 0} pass(es) · source ${side.source}</span></div>` : ""}
      <h3>Flight</h3>
      <div class="lg"><span class="sw" style="background:#57e08a"></span> AUTO</div>
      <div class="lg"><span class="sw" style="background:#ffb545"></span> MANUAL takeover</div>
      <div class="lg"><span class="sw" style="background:#7fd1ff"></span> planned pattern</div>
      <div class="lg"><span class="sw" style="background:#ffd479"></span> drone + camera footprint</div>
      ${state.mission?.plan ? `<div class="lg"><span class="rec-sub">${state.mission.plan.features?.[0]?.properties?.name || ""}</span></div>` : ""}
    </div>`;
  paneLayers.querySelectorAll("input[data-i]").forEach((cb) => cb.addEventListener("change", () => {
    const ids = TOGGLES[Number(cb.dataset.i)][1];
    ids.forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", cb.checked ? "visible" : "none"));
  }));
  paneLayers.querySelectorAll("input[name=covlayer]").forEach((rb) =>
    rb.addEventListener("change", () => setCoverageLayer(rb.value)));
}
$("tab-recs").onclick = () => { paneRecs.hidden = false; paneLayers.hidden = true;
  $("tab-recs").setAttribute("aria-selected", "true"); $("tab-layers").setAttribute("aria-selected", "false"); };
$("tab-layers").onclick = () => { paneRecs.hidden = true; paneLayers.hidden = false;
  $("tab-recs").setAttribute("aria-selected", "false"); $("tab-layers").setAttribute("aria-selected", "true"); };

// --- status line + headless self-check ------------------------------------------------------------------
function setStatus(extra = "") {
  statusEl.textContent =
    `records ${state.records.size} · coverage ${state.coverageLoaded ? "on" : "off"} · ws ${state.wsState}` +
    ` · errors ${state.errors.length}${extra ? "\n" + extra : ""}`;
}

let reported = false;
async function selfCheck() {
  if (reported) return;
  reported = true;
  const resources = performance.getEntriesByType("resource").map((r) => r.name);
  const external = resources.filter((u) => !u.startsWith(ORIGIN) && !u.startsWith("blob:") && !u.startsWith("data:"));
  const feats = map.queryRenderedFeatures();
  const bySource = (s) => feats.filter((f) => f.source === s).length;
  const report = {
    ok: false,
    maplibre: maplibregl.getVersion ? maplibregl.getVersion() : "?",
    ms_to_idle: Math.round(performance.now() - T0),
    basemap_features: bySource("protomaps"),
    source_layers: [...new Set(feats.filter((f) => f.source === "protomaps").map((f) => f.sourceLayer))].sort(),
    marker_features: bySource("records"),
    ring_features: bySource("rings"),
    track_features: bySource("track"),
    plan_features: bySource("plan"),
    cannot_clear_features: bySource("cannot-clear"),
    drone_features: bySource("drone"),
    footprint_features: bySource("footprint"),
    coverage_raster_loaded: state.coverageLoaded,
    coverage_source: state.coverage?.source ?? null,
    coverage_layer: state.covLayer,
    coverage_layers: (state.coverage?.layers || []).map((l) => l.layer),
    coverage_pod_mean: covLayerEntry()?.stats?.mean_pod ?? null,
    coverage_k_is_measured: covLayerEntry()?.k_is_measured ?? null,
    cannot_clear_polygons: state.cannotClear,
    plan_waypoints: (state.mission?.plan?.features || []).filter((f) => f.properties.kind === "waypoint").length,
    track_modes: [...new Set((state.mission?.track?.features || []).map((f) => f.properties.mode))].sort(),
    records_loaded: state.records.size,
    ranked_top: [...state.records.values()].filter((f) => f.properties.priority_rank === 1)
      .map((f) => f.id),
    score_components_present: [...state.records.values()].every((f) => f.properties.score_components &&
      typeof f.properties.score_components.p_living === "number"),
    thumbnails_present: [...state.records.values()].filter((f) => (f.properties.evidence || [])[0]?.thumb_uri).length,
    ws_state: state.wsState,
    resource_requests: resources.length,
    external_requests: external,
    errors: state.errors,
  };
  report.ok = report.basemap_features > 0 && report.marker_features > 0 && report.ring_features > 0 &&
              report.track_features > 0 && report.plan_features > 0 && report.drone_features > 0 &&
              report.footprint_features > 0 && report.cannot_clear_features > 0 &&
              report.coverage_raster_loaded && report.cannot_clear_polygons > 0 &&
              report.score_components_present && report.thumbnails_present > 0 &&
              external.length === 0 && state.errors.length === 0;
  setStatus(JSON.stringify({ basemap: report.basemap_features, markers: report.marker_features,
    rings: report.ring_features, track: report.track_features, hatched: report.cannot_clear_features,
    coverage: report.coverage_raster_loaded, ws: report.ws_state, external: external.length }));
  document.title = report.ok ? "MAP_OK" : "MAP_FAIL";
  window.__sightlineReport = report;
  fetch("/__report", { method: "POST", body: JSON.stringify(report) }).catch(() => {});
}

// --- boot ----------------------------------------------------------------------------------------------
map.on("load", async () => {
  addLayers();
  renderLayerPane();
  try { await loadCoverage(); } catch (e) { state.errors.push("coverage: " + e); }
  try { await loadMission(); } catch (e) { state.errors.push("mission: " + e); }
  try { await loadRecords(); } catch (e) { state.errors.push("records: " + e); }
  await pollOutbox();
  renderLayerPane();
  connectWS();
  setInterval(pollOutbox, 5000);
  setStatus();
  if (SELFCHECK) {
    // one idle after the data layers are populated, then judge
    map.once("idle", () => setTimeout(selfCheck, 400));
    setTimeout(selfCheck, 20000); // hard deadline so the check never hangs
  }
});
map.on("idle", () => setStatus());
</script>
