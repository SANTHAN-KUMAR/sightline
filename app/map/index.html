<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sightline C2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Sightline command-and-control map (F15, SOLUTION_DOC §5.9).

  Offline by construction: MapLibre GL JS, the pmtiles protocol and the Protomaps style/fonts/sprites are all
  vendored under app/map/vendor, and the basemap is data/basemap/wayanad.pmtiles. No CDN, no Mapbox token, no
  external host of any kind — app/map/headless_check.mjs runs the page with every non-loopback name
  unresolvable and fails if a single external request is made.

  Run it:
     D:\Tools\uv\uv.exe run python -m sightline.api.serve --port 8781 --demo
     http://127.0.0.1:8781/app/map/index.html
  Add ?selfcheck=1 for the headless verdict (document.title -> MAP_OK / MAP_FAIL).

  GUARDRAIL R10: this page has no delete. "Dismiss" demands a reason, keeps the record, and moves it to its
  own layer. The search-quality raster shows probability of detection, never a "cleared" flag.
-->
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<script src="vendor/pmtiles/pmtiles.js"></script>
<script src="vendor/protomaps-basemaps/basemaps.js"></script>
<style>
  /* ============================================================================================
     SightLine — design system
     White ground, near-black type, one accent. Plus Jakarta Sans for the interface; Poppins for
     secondary/annotative text. Both are VENDORED (vendor/fonts.css) because headless_check.mjs
     asserts zero external requests: a field laptop in a disaster has no network.

     Rules this sheet holds to:
       - one spacing scale (4/8/12/16/24/32), no arbitrary values
       - one radius (6px) and one tighter radius (4px) for small controls; nothing pill-shaped
         except true status chips, where the shape carries meaning
       - colour is semantic only. Nothing is coloured for decoration
       - no gradients, no shadows for ornament; elevation only where something genuinely floats
         over the map
     ============================================================================================ */
  @import url("vendor/fonts.css");

  :root{
    /* ground and structure */
    --bg:#ffffff;
    --surface:#fafafa;          /* sidebar, table headers */
    --surface-2:#f4f4f5;        /* hover, inset */
    --line:#e4e4e7;             /* hairlines */
    --line-strong:#d4d4d8;      /* borders that must read as edges */

    /* type */
    --ink:#09090b;              /* primary */
    --ink-2:#3f3f46;            /* secondary */
    --dim:#71717a;              /* tertiary, labels */
    --dim-2:#a1a1aa;            /* quaternary, disabled */

    /* semantic — chosen for contrast on white, not for brightness */
    --human:#dc2626;
    --animal:#1d4ed8;
    --ok:#15803d;
    --warn:#b45309;
    --manual:#c2410c;
    --stale:#a16207;
    --dismissed:#71717a;

    /* spacing scale */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r:6px; --r-sm:4px;

    --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-2:'Poppins',system-ui,sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:400 14px/1.5 var(--font);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  #app{display:grid;grid-template-columns:1fr 420px;height:100%}
  #map{position:relative;height:100%}
  #side{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}

  /* ---- brand + status chips ------------------------------------------------------------------ */
  header{padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line);background:var(--bg)}
  header h1{
    margin:0 0 var(--s4);font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;
    color:var(--ink);text-transform:none;
  }
  header h1 .mark{color:var(--human)}
  header h1 small{
    display:block;margin-top:var(--s1);font:400 12px/1.4 var(--font-2);color:var(--dim);
    letter-spacing:.01em;
  }
  .chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .chip{
    font:500 11px/1.6 var(--font);padding:2px 10px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);color:var(--dim);white-space:nowrap;
  }
  .chip b{color:var(--ink);font-weight:600}
  .chip.live{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .chip.live b{color:#166534}
  .chip.down{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .chip.down b{color:#b91c1c}
  .chip.sim{background:#fffbeb;border-color:#fde68a;color:#92400e}
  .chip.sim b{color:#92400e}

  /* ---- tabs ---------------------------------------------------------------------------------- */
  .tabs{display:flex;gap:var(--s5);padding:0 var(--s5);border-bottom:1px solid var(--line);background:var(--bg)}
  .tabs button{
    flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
    padding:var(--s3) 0;font:600 13px/1 var(--font);cursor:pointer;letter-spacing:-.01em;
    transition:color .12s ease,border-color .12s ease;
  }
  .tabs button:hover{color:var(--ink-2)}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-sm)}
  .pane{flex:1;overflow:auto;padding:var(--s4) var(--s5) var(--s5)}

  /* ---- the RUN pane: mission control, live metrics, and the demo launcher ----------------------
     This is the half of the console that was a separate page. It lives here because an operator
     should not have to change page to answer "is it flying, what is it seeing, and how fast".
     Metrics first, controls second: the readout is what you watch, the buttons are what you press
     once. */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
           border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:var(--s5)}
  .metric{background:var(--bg);padding:var(--s3) var(--s3) calc(var(--s3) - 2px)}
  .metric .k{display:block;font:500 9.5px/1.5 var(--font);letter-spacing:.07em;text-transform:uppercase;
             color:var(--dim-2)}
  .metric .v{display:block;font:600 15px/1.35 var(--mono);color:var(--ink);letter-spacing:-.02em;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .metric .v.off{color:var(--dim-2);font-weight:400}
  .metric.wide{grid-column:span 3}
  .metric.half{grid-column:span 3}

  .sec{font:600 10.5px/1.4 var(--font);text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
       margin:var(--s5) 0 var(--s3)}
  .sec:first-child{margin-top:0}

  .pf{list-style:none;margin:0 0 var(--s4);padding:0;font:400 12px/1.6 var(--font-2)}
  .pf li{display:flex;gap:var(--s2);align-items:flex-start;padding:2px 0;color:var(--dim)}
  .pf .s{flex:none;width:13px;font:700 12px/1.6 var(--mono)}
  .pf .ok .s{color:var(--ok)} .pf .no .s{color:var(--human)}
  .pf .no{color:var(--ink-2)}
  .pf b{font-weight:600;color:var(--ink-2)}

  .demo{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;
        border-bottom:1px solid var(--line)}
  .demo:last-of-type{border-bottom:0}
  .demo .t{font:600 13px/1.4 var(--font);letter-spacing:-.01em}
  .demo .d{font:400 11.5px/1.55 var(--font-2);color:var(--dim);margin-top:1px}
  .demo .go{margin-left:auto;flex:none}
  .runbtn{font:600 12px/1 var(--font);border:1px solid var(--line-strong);background:var(--bg);
          color:var(--ink);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;min-height:32px;
          transition:background .12s ease,border-color .12s ease}
  .runbtn:hover:not(:disabled){background:var(--surface-2);border-color:var(--dim-2)}
  .runbtn:disabled{opacity:.38;cursor:not-allowed}
  .runbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .runbtn.stop{border-color:#fecaca;background:#fef2f2;color:var(--human);width:100%}
  .runbtn.stop:hover:not(:disabled){background:#fee2e2;border-color:#fca5a5}
  .runmsg{font:400 11.5px/1.55 var(--font-2);color:var(--human);margin-top:var(--s3);
          white-space:pre-wrap}
  .runlog{margin:var(--s3) 0 0;background:var(--surface);border:1px solid var(--line);
          border-radius:var(--r);padding:var(--s3);font:10.5px/1.6 var(--mono);color:var(--ink-2);
          max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-word}

  .pane[hidden]{display:none}

  /* ---- record list ----------------------------------------------------------------------------
     Deliberately a LIST, not a deck of cards: a commander scans these top to bottom under time
     pressure, and card chrome on every row is noise between them. Separation is a hairline. */
  .rec{
    border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:transparent;
    cursor:pointer;padding:var(--s4) var(--s2);transition:background .12s ease;
  }
  .rec:first-child{padding-top:var(--s2)}
  .rec:hover{background:var(--surface)}
  .rec.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--ink)}
  .rec.dismissed{opacity:.5}
  .rec-top{display:flex;align-items:flex-start;gap:var(--s3);padding:0}
  .rank{
    min-width:22px;height:22px;border-radius:var(--r-sm);display:grid;place-items:center;
    font:700 11px/1 var(--font);color:#fff;flex:none;margin-top:1px;
  }
  .rec-id{
    font:600 13px/1.45 var(--font);color:var(--ink);letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .rec-sub{font:400 12px/1.6 var(--font-2);color:var(--dim);margin-top:2px}
  .grow{flex:1;min-width:0}
  /* the score ramp: one thin rule, not a chunky bar. It is a reading aid, not the headline. */
  .bars{display:flex;height:3px;border-radius:2px;overflow:hidden;margin:var(--s3) 0 var(--s2) 34px}
  .bars i{display:block;height:100%}
  .why{
    font:400 11.5px/1.7 var(--font-2);color:var(--dim);padding:0 0 0 34px;
    display:flex;flex-wrap:wrap;gap:0 var(--s3);
  }
  .why b{color:var(--ink-2);font-weight:600;font-family:var(--font)}

  .status-pill{
    font:600 10px/1.6 var(--font);padding:1px 8px;border-radius:999px;border:1px solid var(--line);
    color:var(--dim);text-transform:lowercase;letter-spacing:.01em;white-space:nowrap;
  }
  .st-confirmed{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
  .st-candidate{color:var(--ink-2);border-color:var(--line-strong);background:var(--surface)}
  .st-stale{color:#92400e;border-color:#fde68a;background:#fffbeb}
  .st-dismissed{color:var(--dim);border-color:var(--line);background:var(--surface)}

  /* ---- layers pane ---------------------------------------------------------------------------- */
  label.toggle{
    display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0;color:var(--ink-2);
    cursor:pointer;font-size:13px;
  }
  label.toggle:hover{color:var(--ink)}
  label.toggle input{accent-color:var(--ink);width:15px;height:15px}
  .legend{margin-top:var(--s5);border-top:1px solid var(--line);padding-top:var(--s4)}
  .legend h3,.pane h3{
    font:600 11px/1.4 var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
    margin:var(--s5) 0 var(--s3);
  }
  .pane h3:first-child{margin-top:0}
  .lg{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0;font-size:12.5px;color:var(--ink-2)}
  .sw{width:14px;height:14px;border-radius:var(--r-sm);flex:none;border:1px solid var(--line-strong)}
  .ramp{height:10px;border-radius:var(--r-sm);flex:1;
        background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)}

  /* ---- MapLibre popup -------------------------------------------------------------------------- */
  .maplibregl-popup-content{
    background:var(--bg);color:var(--ink);border:1px solid var(--line-strong);
    border-radius:var(--r);padding:0;box-shadow:0 12px 32px rgba(9,9,11,.14);max-width:380px;
  }
  .maplibregl-popup-tip{border-top-color:var(--bg)!important;border-bottom-color:var(--bg)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:20px;padding:var(--s1) var(--s2);line-height:1}
  .maplibregl-popup-close-button:hover{color:var(--ink);background:transparent}
  /* The popup must never run off the bottom of the screen: the score total, the R10 reason box and the
     dismiss button live at its foot, and an operator has to be able to see and reach them. */
  .maplibregl-popup-content{max-height:calc(100vh - 90px);overflow:hidden}
  .pop{width:360px;max-height:calc(100vh - 92px);overflow-y:auto}
  .pop img{width:100%;height:150px;object-fit:cover;display:block;
           border-radius:var(--r) var(--r) 0 0;background:var(--surface-2)}
  .pop-body{padding:var(--s4) var(--s4) var(--s4)}
  .pop h2{
    margin:0 0 var(--s1);font:700 16px/1.35 var(--font);letter-spacing:-.015em;
    display:flex;align-items:center;gap:var(--s2);word-break:break-all;
  }
  .kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s1) var(--s4);font-size:12.5px;margin:var(--s3) 0}
  .kv dt{color:var(--dim);font-family:var(--font-2)}
  .kv dd{margin:0;color:var(--ink-2)}
  table.sc{width:100%;border-collapse:collapse;font-size:12.5px;margin:var(--s3) 0 var(--s1)}
  table.sc th{text-align:left;color:var(--dim);font:400 12.5px/1.8 var(--font-2);padding:2px 0}
  table.sc td{text-align:right;font-variant-numeric:tabular-nums;padding:2px 0;color:var(--ink-2)}
  table.sc tr.tot td,table.sc tr.tot th{
    border-top:1px solid var(--line);font-weight:700;padding-top:var(--s2);color:var(--ink);
    font-family:var(--font);
  }
  .formula{font:11px/1.6 var(--mono);color:var(--dim);margin:var(--s2) 0 0}

  /* ---- buttons and inputs ---------------------------------------------------------------------- */
  .act{display:flex;gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap}
  .act button,.act input{
    font:500 13px/1 var(--font);border-radius:var(--r-sm);border:1px solid var(--line-strong);
    background:var(--bg);color:var(--ink);padding:var(--s2) var(--s3);min-height:34px;
    transition:background .12s ease,border-color .12s ease;
  }
  .act button{cursor:pointer}
  .act button:hover{background:var(--surface-2);border-color:var(--dim-2)}
  .act button:active{background:var(--line)}
  .act button:focus-visible,.act input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .act button.danger{border-color:#fecaca;color:var(--human);background:#fef2f2}
  .act button.danger:hover{background:#fee2e2;border-color:#fca5a5}
  .act input{flex:1;min-width:140px;font-family:var(--font-2)}
  .act input::placeholder{color:var(--dim-2)}
  .err{color:var(--human);font:400 11.5px/1.5 var(--font-2);margin-top:var(--s2);min-height:16px}

  /* ---- F3 pilot HUD (sightline/api/control_feed.py) ---------------------------------------------
     Driven by the "control" WebSocket message the flight loop pushes at 10 Hz. Deliberately an
     OVERLAY on the map rather than a panel beside it: a judge flies the aircraft and sees the
     consequence on the same picture, so their eyes stay in one place. Hidden until a flight pushes
     control state, so a replay or a static review looks exactly as it did before. */
  #hud{
    position:absolute;right:var(--s4);bottom:56px;z-index:5;width:360px;display:none;
    background:rgba(255,255,255,.96);border:1px solid var(--line-strong);border-radius:var(--r);
    overflow:hidden;box-shadow:0 8px 28px rgba(9,9,11,.12);backdrop-filter:blur(6px);
  }
  #hud.on{display:block}
  #hud.manual{border-color:var(--manual);box-shadow:0 0 0 1px var(--manual) inset,0 8px 28px rgba(9,9,11,.14)}
  .hud-top{
    display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .hud-mode{font:700 15px/1 var(--font);letter-spacing:.02em}
  .m-AUTO{color:var(--ok)} .m-MANUAL{color:var(--manual)} .m-HOLD{color:#7e22ce} .m-RTL{color:var(--human)}
  .hud-who{font:400 11.5px/1.45 var(--font-2);color:var(--dim);flex:1}
  .hud-who b{color:var(--ink);font-family:var(--font);font-weight:600}
  /* The idle-hand-back countdown. A ring rather than a number because what a judge reads at a glance,
     from two metres away, is "how much time have I got", not a decimal. */
  .ring{width:38px;height:38px;flex:none;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--manual);transition:stroke-dashoffset .1s linear}
  .ring.soon .fg{stroke:var(--warn)}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px/1 var(--font);color:var(--ink)}

  .hud-body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  /* Sticks left, buttons right. The buttons are a fixed 3-column grid rather than a wrapping flex row:
     wrapping made the panel change height whenever a button appeared, which reads as the page twitching.
     A grid keeps every control in the same place for the whole demo. */
  .sticks{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:start}
  .stickpair{display:flex;gap:var(--s3)}
  .stick{
    width:70px;height:70px;border:1px solid var(--line-strong);border-radius:var(--r);position:relative;
    background:var(--surface);
  }
  .stick::before,.stick::after{content:"";position:absolute;background:var(--line)}
  .stick::before{left:50%;top:var(--s1);bottom:var(--s1);width:1px}
  .stick::after{top:50%;left:var(--s1);right:var(--s1);height:1px}
  .stick i{
    position:absolute;width:12px;height:12px;border-radius:50%;background:var(--manual);
    margin:-6px 0 0 -6px;transition:left .06s linear,top .06s linear;
  }
  .stick.idle i{background:var(--dim-2)}
  .stick label{
    position:absolute;bottom:-16px;left:-6px;right:-6px;text-align:center;
    font:400 9.5px/1.3 var(--font-2);color:var(--dim);white-space:nowrap;
  }
  .stickwrap{position:relative;padding-bottom:18px}

  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1)}
  .btn{
    font:600 9.5px/1.6 var(--font);letter-spacing:.04em;padding:var(--s1) 0;border-radius:var(--r-sm);
    border:1px solid var(--line);color:var(--dim);background:var(--bg);text-align:center;
    text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;
  }
  .btn.on{background:var(--manual);border-color:var(--manual);color:#fff}
  .btn.warn{border-color:var(--warn);color:var(--warn)}

  .envelope{
    font:500 11.5px/1.5 var(--font);color:#92400e;border:1px solid #fde68a;background:#fffbeb;
    border-radius:var(--r-sm);padding:var(--s2) var(--s3);display:none;
  }
  .envelope.on{display:block}

  .feed{
    max-height:112px;overflow:auto;border-top:1px solid var(--line);padding:var(--s2) var(--s4) var(--s3);
    font:400 11.5px/1.6 var(--font-2);
  }
  .feed .ev{display:flex;gap:var(--s2);padding:1px 0}
  .feed .t{color:var(--dim-2);flex:none;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:10.5px}
  .feed .k{flex:none;width:3px;border-radius:2px;background:var(--dim-2)}
  .ev-mode .k{background:var(--manual)} .ev-mark .k{background:var(--human)}
  .ev-envelope .k{background:var(--warn)} .ev-pad .k{background:#7e22ce} .ev-record .k{background:var(--ok)}
  .feed .x{color:var(--ink)} .feed .d{color:var(--dim)}

  /* A takeover is the moment the demo is about, so it gets a full-width flash across the map. */
  #takeover{
    position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;text-align:center;
    padding:var(--s2);font:700 12px/1.4 var(--font);letter-spacing:.16em;opacity:0;
    transition:opacity .25s;background:var(--manual);color:#fff;
  }
  #takeover.show{opacity:1}
  /* Pilot marks: the judge's own pins, visually distinct from detections so nobody confuses
     "a human said so" with "the detector said so". */
  .mark-dot{
    width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--manual);
    box-shadow:0 1px 4px rgba(9,9,11,.2);
  }

  /* ---- map overlays ----------------------------------------------------------------------------- */
  #banner{position:absolute;left:var(--s4);top:var(--s4);z-index:3;display:flex;gap:var(--s2);align-items:center}
  #status{
    position:absolute;left:var(--s4);bottom:var(--s5);z-index:3;background:rgba(255,255,255,.94);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);
    font:11px/1.5 var(--mono);white-space:pre;color:var(--dim);backdrop-filter:blur(6px);
  }

  /* ---- operator camera ---------------------------------------------------------------------------
     The map answers "where"; this answers "what is the drone looking at now, and is the model seeing
     what I am seeing?" Boxes are drawn server-side by sightline.mission.liveview. */
  #camera{
    position:absolute;left:var(--s4);bottom:76px;width:440px;z-index:6;background:var(--bg);
    border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;
    box-shadow:0 8px 28px rgba(9,9,11,.12);
  }
  #camera-head{
    display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);background:var(--surface);
    border-bottom:1px solid var(--line);font:600 10px/1.6 var(--font);letter-spacing:.1em;color:var(--ink-2);
  }
  #camera-meta{margin-left:auto;font:400 10.5px/1.6 var(--mono);color:var(--dim);letter-spacing:0}
  /* A STALE FRAME MUST LOOK STALE. The panel showed an hour-old picture with the word "stale" in 10 px
     of grey, and it read as a live view of an aircraft that was airborne - the single most misleading
     thing this page could do. Now the image greys out and the header goes amber. */
  #camera.stale #camera-img{filter:grayscale(1) opacity(.45)}
  #camera.stale #camera-head{background:#fffbeb;border-bottom-color:#fde68a}
  #camera.stale #camera-meta{color:var(--warn);font-weight:600}
  #camera.stale #camera-title::after{content:" — NOT LIVE";color:var(--warn);font-weight:700}
  #camera-toggle{
    background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;
    padding:0 var(--s1);border-radius:var(--r-sm);
  }
  #camera-toggle:hover{color:var(--ink);background:var(--surface-2)}
  #camera-img{display:block;width:100%;background:var(--surface-2)}
  #camera.collapsed #camera-img{display:none}

  .maplibregl-ctrl-attrib{font:400 10px/1.5 var(--font-2)}
  .maplibregl-ctrl-group{border-radius:var(--r-sm)!important;box-shadow:0 1px 4px rgba(9,9,11,.12)!important}

  /* ---- responsive ---------------------------------------------------------------------------------
     One design language at every width. Below 1100px the sidebar narrows; below 860px it becomes a
     sheet under the map rather than beside it, because a 40 %-wide column of 12 px type is unreadable
     on a tablet held in portrait. The map keeps the majority of the viewport at every size, since the
     map is the product. */
  @media (max-width:1280px){
    #app{grid-template-columns:1fr 380px}
    #camera{width:380px}
  }
  @media (max-width:1100px){
    #app{grid-template-columns:1fr 340px}
    header{padding:var(--s4)}
    header h1{font-size:21px}
    .tabs,.pane{padding-left:var(--s4);padding-right:var(--s4)}
    #camera{width:320px}
    /* Two columns, not three. At 320 px the 3-column grid truncated every label to "TAKE...", "RESU...",
       "BOO..." - a control whose name you cannot read is not a control. Two columns fit the words. */
    #hud{width:320px}
    #hud .btns{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:860px){
    #app{grid-template-columns:1fr;grid-template-rows:minmax(280px,52vh) 1fr;height:100%}
    #side{border-left:0;border-top:1px solid var(--line)}
    #camera{width:min(320px,calc(100% - 32px));bottom:64px}
    #hud{width:min(320px,calc(100% - 32px));right:var(--s4)}
    .pop{width:min(340px,86vw)}
  }
  @media (max-width:560px){
    header{padding:var(--s3) var(--s4)}
    header h1{font-size:19px}
    .tabs{gap:var(--s4)}
    #status{left:var(--s3);bottom:var(--s3);font-size:10px;max-width:calc(100% - 24px);overflow:hidden}
    /* The map is the product. A 440 px camera panel over a 52vh map on a phone hides the thing the
       operator came to look at, so the feed is capped to a glanceable strip rather than a viewer -
       enough to confirm the model is seeing what they are seeing, not enough to bury the map. */
    #camera{left:var(--s3);right:var(--s3);width:auto;bottom:56px}
    #camera-img{max-height:132px;object-fit:cover}
    #camera-meta{font-size:9.5px}
    #hud{display:none!important}   /* a 320 px HUD over a 360 px map is not a usable instrument */
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="banner"></div>
    <div id="takeover"></div>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-mode m-AUTO" id="hud-mode">AUTO</div>
        <div class="hud-who" id="hud-who"></div>
        <div class="ring" id="hud-ring" hidden>
          <svg width="38" height="38" viewBox="0 0 38 38">
            <circle class="bg" cx="19" cy="19" r="16" fill="none" stroke-width="3"></circle>
            <circle class="fg" cx="19" cy="19" r="16" fill="none" stroke-width="3"
                    stroke-linecap="round" stroke-dasharray="100.53" stroke-dashoffset="0"></circle>
          </svg>
          <span id="hud-count"></span>
        </div>
      </div>
      <div class="hud-body">
        <div class="sticks">
          <div class="stickpair">
            <div class="stickwrap">
              <div class="stick idle" id="stick-l"><i></i><label>throttle&nbsp;/&nbsp;yaw</label></div>
            </div>
            <div class="stickwrap">
              <div class="stick idle" id="stick-r"><i></i><label>pitch&nbsp;/&nbsp;roll</label></div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
            <div class="btns" id="hud-btns"></div>
            <div id="hud-flight" style="font-size:10px;color:var(--dim);line-height:1.5"></div>
          </div>
        </div>
        <div class="envelope" id="hud-env"></div>
      </div>
      <div class="feed" id="hud-feed"></div>
    </div>
    <!-- The OPERATOR VIEW. The map answers "where"; this answers "what is the drone looking at now, and
         is the model seeing what I am seeing?" Boxes are drawn server-side by sightline.mission.liveview
         and coloured by score, so a weak detection looks weak at a glance. -->
    <div id="camera" hidden>
      <div id="camera-head">
        <span id="camera-title">CAMERA</span>
        <span id="camera-meta"></span>
        <button id="camera-toggle" type="button" title="hide the camera view">&minus;</button>
      </div>
      <img id="camera-img" alt="live camera view with detections">
    </div>
    <div id="status">starting…</div>
  </div>
  <div id="side">
    <header>
      <h1><span class="mark">Sight</span>Line<small>Aerial survivor triage</small></h1>
      <div class="chips" id="chips"></div>
    </header>
    <div class="tabs" role="tablist">
      <button id="tab-recs" role="tab" aria-selected="true">Records</button>
      <button id="tab-layers" role="tab" aria-selected="false">Layers</button>
      <button id="tab-run" role="tab" aria-selected="false">Run</button>
    </div>
    <div class="pane" id="pane-recs"></div>
    <div class="pane" id="pane-layers" hidden></div>
    <div class="pane" id="pane-run" hidden>
      <div class="sec">Live</div>
      <div class="metrics" id="metrics"></div>
      <div class="sec">Readiness</div>
      <ul class="pf" id="preflight"><li><span class="s">·</span><span>checking…</span></li></ul>
      <button class="runbtn stop" id="run-stop" disabled>Stop everything</button>
      <div class="runmsg" id="run-msg"></div>
      <div id="run-demos"></div>
      <div class="sec">Output</div>
      <pre class="runlog" id="run-log">Nothing has run yet.</pre>
    </div>
  </div>
</div>

<script type="module">
import * as maplibregl from "./vendor/maplibre-gl/maplibre-gl.mjs";

const ORIGIN = location.origin;
const QS = new URLSearchParams(location.search);
const SELFCHECK = QS.get("selfcheck") === "1";
const CENTER = [Number(QS.get("lon") ?? 76.1450), Number(QS.get("lat") ?? 11.4870)];
const T0 = performance.now();
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), chipsEl = $("chips"), paneRecs = $("pane-recs"), paneLayers = $("pane-layers");

const CLASS_COLOR = { human: "#e63946", animal: "#3d87c9" };
const DISMISSED = "#7b8794";
const state = {
  records: new Map(), selected: null, ws: null, wsState: "connecting", outbox: null,
  coverage: null, coverageLoaded: false, covLayer: QS.get("layer") || "", cannotClear: 0,
  mission: null, domain: null, errors: [], lastSeq: 0,
  //: The F3 pilot feed. Null until a flight pushes one, which is what keeps the HUD hidden on a map that
  //: is only being reviewed rather than flown.
  control: null, marks: [],
  //: The operator camera's latest frame, when it arrived, and the loop rate derived from the two. The
  //: rate is measured rather than declared because every timing claim this project makes depends on it.
  view: null, viewAt: 0, fps: 0,
  //: True when the store was pre-loaded with fixtures (`serve --demo`). The map cannot tell a seeded
  //: record from a live one, so the server is asked and the answer is shown.
  seeded: false,
};
// Exposed for app/map/headless_check.mjs (and for a console poke); nothing in the page reads it back.
window.__sightlineState = state;

// --- WGS-84 metres-per-degree (matches sightline/common/geodesy.py; the h_acc ring must be metre-true) ---
const A = 6378137.0, E2 = (1 / 298.257223563) * (2 - 1 / 298.257223563);
function metresPerDeg(lat) {
  const s = Math.sin(lat * Math.PI / 180), w = 1 - E2 * s * s;
  return { lat: (Math.PI / 180) * A * (1 - E2) / Math.pow(w, 1.5),
           lon: (Math.PI / 180) * (A / Math.sqrt(w)) * Math.cos(lat * Math.PI / 180) };
}
function circlePolygon(lon, lat, radiusM, n = 64) {
  const m = metresPerDeg(lat), ring = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    ring.push([lon + (radiusM / m.lon) * Math.cos(a), lat + (radiusM / m.lat) * Math.sin(a)]);
  }
  return { type: "Polygon", coordinates: [ring] };
}
const EMPTY = { type: "FeatureCollection", features: [] };

// --- basemap style (copied from the verified verify_offline.html) ----------------------------------------
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const style = {
  version: 8,
  glyphs: `${ORIGIN}/app/map/vendor/basemaps-assets/fonts/{fontstack}/{range}.pbf`,
  sprite: `${ORIGIN}/app/map/vendor/basemaps-assets/sprites/v4/light`,
  sources: {
    protomaps: {
      type: "vector",
      url: `pmtiles://${ORIGIN}/data/basemap/wayanad.pmtiles`,
      attribution: '<a href="https://protomaps.com">Protomaps</a> &copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
    },
  },
  layers: basemaps.layers("protomaps", basemaps.namedFlavor("light"), { lang: "en" }),
};

const map = new maplibregl.Map({
  container: "map", style, center: CENTER, zoom: Number(QS.get("z") ?? 14.4),
  attributionControl: { compact: false }, hash: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 140, unit: "metric" }), "bottom-left");
map.on("error", (e) => state.errors.push(String(e.error?.message || e.error || e)));

// --- diagonal hatch for "aerial search cannot clear" (§5.9) ---------------------------------------------
function hatchImage(size = 8, color = "#ff6b6b") {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.clearRect(0, 0, size, size);
  g.strokeStyle = color;
  g.lineWidth = 2;
  g.lineCap = "square";
  g.beginPath();
  // 45-degree lines with period `size` in x tile seamlessly in both directions.
  for (const off of [-size, 0, size]) { g.moveTo(off, size); g.lineTo(off + size, 0); }
  g.stroke();
  return g.getImageData(0, 0, size, size);
}

// --- layer construction --------------------------------------------------------------------------------
// size = rank (rank 1 is biggest), colour = class, ring = h_acc_m.
const RANK_RADIUS = ["case", ["<", ["get", "priority_rank"], 0], 5,
  ["interpolate", ["linear"], ["get", "priority_rank"], 1, 13, 4, 9, 10, 6, 25, 4.5]];
const CLASS_PAINT = ["match", ["get", "cls"], "animal", CLASS_COLOR.animal, CLASS_COLOR.human];
const NOT_DISMISSED = ["!=", ["get", "status"], "dismissed"];
const IS_DISMISSED = ["==", ["get", "status"], "dismissed"];

function addLayers() {
  const firstSymbol = (map.getStyle().layers || []).find((l) => l.type === "symbol")?.id;
  state.firstSymbol = firstSymbol;  // overlays go UNDER the basemap's place labels
  map.addImage("cannot-clear-hatch", hatchImage());

  map.addSource("cannot-clear", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "cannot-clear-base", type: "fill", source: "cannot-clear",
    paint: { "fill-color": "#ff6b6b", "fill-opacity": 0.16 } }, firstSymbol);
  map.addLayer({ id: "cannot-clear-fill", type: "fill", source: "cannot-clear",
    paint: { "fill-pattern": "cannot-clear-hatch", "fill-opacity": 0.85 } }, firstSymbol);
  map.addLayer({ id: "cannot-clear-line", type: "line", source: "cannot-clear",
    paint: { "line-color": "#dc2626", "line-width": 1.6, "line-opacity": 0.95 } }, firstSymbol);

  map.addSource("plan", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "plan-line", type: "line", source: "plan",
    filter: ["==", ["geometry-type"], "LineString"],
    paint: { "line-color": "#2563eb", "line-width": 1.6, "line-dasharray": [3, 2], "line-opacity": 0.75 } });
  map.addLayer({ id: "plan-wp", type: "circle", source: "plan",
    filter: ["==", ["geometry-type"], "Point"],
    paint: { "circle-radius": 2.6, "circle-color": "#7fd1ff", "circle-opacity": 0.8 } });

  map.addSource("track", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "track-line", type: "line", source: "track",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-width": 2.6,
      "line-color": ["match", ["get", "mode"], "MANUAL", "#c2410c", "HOLD", "#7e22ce", "RTL", "#dc2626", "#15803d"],
      "line-opacity": 0.95 } });

  map.addSource("footprint", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "footprint-fill", type: "fill", source: "footprint",
    paint: { "fill-color": "#ffd479", "fill-opacity": 0.16 } });
  map.addLayer({ id: "footprint-line", type: "line", source: "footprint",
    paint: { "line-color": "#c2410c", "line-width": 1.8, "line-opacity": 0.95 } });

  map.addSource("rings", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "acc-ring-fill", type: "fill", source: "rings", filter: NOT_DISMISSED,
    paint: { "fill-color": CLASS_PAINT, "fill-opacity": 0.10 } });
  map.addLayer({ id: "acc-ring-line", type: "line", source: "rings", filter: NOT_DISMISSED,
    paint: { "line-color": CLASS_PAINT, "line-width": 1.6, "line-opacity": 0.8,
             "line-dasharray": [2, 2] } });

  // Pilot marks (F3): gold, ringed, labelled with the press order. Deliberately unlike a detection pin -
  // the demo must never let "a judge pointed at this" read as "the detector found this".
  map.addSource("marks", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "mark-halo", type: "circle", source: "marks",
                 paint: { "circle-radius": 13, "circle-color": "#ffd479", "circle-opacity": 0.18,
                          "circle-stroke-color": "#c2410c", "circle-stroke-width": 1,
                          "circle-stroke-opacity": 0.5 } });
  map.addLayer({ id: "mark-dot", type: "circle", source: "marks",
                 paint: { "circle-radius": 6, "circle-color": "#ffd479",
                          "circle-stroke-color": "#7c2d12", "circle-stroke-width": 2 } });
  map.addLayer({ id: "mark-label", type: "symbol", source: "marks",
                 layout: { "text-field": ["concat", "M", ["to-string", ["get", "idx"]]],
                           "text-font": ["Noto Sans Regular"], "text-size": 10,
                           "text-offset": [0, -1.5], "text-allow-overlap": true },
                 paint: { "text-color": "#9a3412", "text-halo-color": "#ffffff", "text-halo-width": 1.4 } });

  map.addSource("records", { type: "geojson", data: EMPTY });
  map.addLayer({ id: "markers-dismissed", type: "circle", source: "records", filter: IS_DISMISSED,
    paint: { "circle-radius": 5, "circle-color": "rgba(0,0,0,0)", "circle-stroke-width": 1.6,
             "circle-stroke-color": DISMISSED, "circle-opacity": 1 } });
  map.addLayer({ id: "markers", type: "circle", source: "records", filter: NOT_DISMISSED,
    paint: { "circle-radius": RANK_RADIUS, "circle-color": CLASS_PAINT,
             "circle-stroke-width": ["case", ["==", ["get", "status"], "confirmed"], 2.2, 1.2],
             "circle-stroke-color": "#ffffff",
             "circle-opacity": ["case", ["==", ["get", "status"], "stale"], 0.55, 0.95] } });
  map.addLayer({ id: "marker-rank", type: "symbol", source: "records", filter: NOT_DISMISSED,
    layout: { "text-field": ["case", ["<", ["get", "priority_rank"], 0], "?",
                             ["to-string", ["get", "priority_rank"]]],
              "text-font": ["Noto Sans Medium"], "text-size": 11, "text-allow-overlap": true },
    paint: { "text-color": "#ffffff", "text-halo-color": "#000", "text-halo-width": 1 } });

  map.addSource("drone", { type: "geojson", data: EMPTY });
  // The halo is deliberately smaller than the camera footprint: at survey altitude the footprint is only
  // ~85 x 48 m, and a fat halo swallows it (it did, in the first render of this page).
  map.addLayer({ id: "drone-halo", type: "circle", source: "drone",
    paint: { "circle-radius": 8, "circle-color": "#ffd479", "circle-opacity": 0.16,
             "circle-stroke-color": "#c2410c", "circle-stroke-width": 1 } });
  map.addLayer({ id: "drone-dot", type: "circle", source: "drone",
    paint: { "circle-radius": 4.2, "circle-color": "#ffd479", "circle-stroke-color": "#241c05",
             "circle-stroke-width": 1.6 } });

  for (const id of ["markers", "markers-dismissed"]) {
    map.on("click", id, (e) => openRecord(e.features[0].properties.record_id));
    map.on("mouseenter", id, () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", id, () => (map.getCanvas().style.cursor = ""));
  }

  // The plan lane states WHY each leg exists in the waypoint's `reason`; show it rather than hide it.
  map.on("click", "plan-wp", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true, offset: 10 })
      .setLngLat(e.lngLat)
      .setHTML(`<div class="pop-body" style="width:280px"><h2>waypoint ${p.seq ?? "?"} · ${p.action || "goto"}</h2>
        <div class="rec-sub">${fmt(p.agl_m, 0)} m AGL · ${fmt(p.speed_ms, 1)} m/s · gimbal ${fmt(p.gimbal_pitch_deg, 0)}°
        · segment ${p.segment_id || "—"} · pass ${p.pass_id ?? "—"}</div>
        <p class="formula">${p.reason || ""}</p></div>`)
      .addTo(map);
  });
  map.on("mouseenter", "plan-wp", () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", "plan-wp", () => (map.getCanvas().style.cursor = ""));

  // The "aerial search cannot clear" polygons must say so when clicked (R10, §2.7).
  map.on("click", "cannot-clear-fill", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true, offset: 6 })
      .setLngLat(e.lngLat)
      .setHTML(`<div class="pop-body" style="width:270px"><h2 style="color:#ff9b9b">${p.label || "aerial search cannot clear"}</h2>
        <p class="formula">POD is held at 0 inside this polygon no matter how much it is overflown.
        It is never "cleared"; clearing it needs ground search, canine or radar (§2.7, R10).</p>
        <div class="rec-sub">domain ${p.domain || "?"}${p.reason ? " · " + p.reason : ""}</div></div>`)
      .addTo(map);
  });
}

// --- data plumbing -------------------------------------------------------------------------------------
function upsert(feature) {
  state.records.set(feature.id ?? feature.properties.record_id, feature);
  if (state.domain === null) state.domain = feature.properties?.source?.domain ?? null;
}
function renderRecords() {
  const feats = [...state.records.values()];
  map.getSource("records")?.setData({ type: "FeatureCollection", features: feats });
  map.getSource("rings")?.setData({
    type: "FeatureCollection",
    features: feats.map((f) => ({
      type: "Feature", id: f.id, properties: f.properties,
      geometry: circlePolygon(f.geometry.coordinates[0], f.geometry.coordinates[1],
                              Math.max(0.5, f.properties.h_acc_m || 0)),
    })),
  });
  renderList(feats);
  renderChips();
}

async function loadRecords() {
  const r = await fetch("/api/records.geojson");
  if (!r.ok) throw new Error(`records ${r.status}`);
  const fc = await r.json();
  state.records.clear();
  fc.features.forEach(upsert);
  renderRecords();
  return fc.features.length;
}

// The sidecar is sightline/api/coverage_feed.py's normalisation of the coverage lane's own coverage.json
// (product "sightline.coverage"): one entry per presentation layer, each with an API image/geojson URL,
// its k and — crucially — whether that k was MEASURED. Today it never is, and the page says so.
function covLayerEntry() {
  const side = state.coverage;
  if (!side?.layers?.length) return null;
  return side.layers.find((l) => l.layer === state.covLayer) || side.layers[0];
}

async function loadCoverage() {
  const r = await fetch("/api/coverage/overlay.json");
  if (!r.ok) { setStatus(); return false; }
  const side = await r.json();
  state.coverage = side;
  if (!side.layers?.length) { state.errors.push("coverage sidecar has no layers"); return false; }
  if (!side.layers.some((l) => l.layer === state.covLayer)) state.covLayer = side.default_layer || side.layers[0].layer;
  const entry = covLayerEntry();
  await new Promise((res) => {
    const img = new Image();
    img.onload = () => { state.coverageLoaded = true; res(); };
    img.onerror = () => { state.errors.push("coverage raster failed to load: " + entry.image_url); res(); };
    img.src = entry.image_url;
  });
  if (state.coverageLoaded) {
    // The image source is created only once a real raster exists: MapLibre rejects a degenerate placeholder.
    if (map.getSource("coverage")) {
      map.getSource("coverage").updateImage({ url: entry.image_url, coordinates: side.coordinates });
    } else {
      map.addSource("coverage", { type: "image", url: entry.image_url, coordinates: side.coordinates });
      const under = map.getLayer("cannot-clear-base") ? "cannot-clear-base" : state.firstSymbol;
      map.addLayer({ id: "coverage-pod", type: "raster", source: "coverage",
        paint: { "raster-opacity": 0.42, "raster-resampling": "nearest" } }, under);
    }
  }
  // The burial polygons: the coverage PNG is transparent over them, so this hatch is what fills the hole.
  const cc = await fetch("/api/coverage/cannot_clear.geojson?layer=" + encodeURIComponent(state.covLayer));
  if (cc.ok) {
    const fc = await cc.json();
    state.cannotClear = fc.features.length;
    map.getSource("cannot-clear").setData(fc);
  }
  renderLayerPane();
  renderChips();
  return state.coverageLoaded;
}

async function setCoverageLayer(name) {
  state.covLayer = name;
  state.coverageLoaded = false;
  await loadCoverage();
  setStatus();
}

async function loadMission() {
  const r = await fetch("/api/mission");
  if (!r.ok) return false;
  applyMission(await r.json());
  return true;
}
function applyMission(m) {
  state.mission = m;
  map.getSource("track")?.setData(m.track || EMPTY);
  map.getSource("plan")?.setData(m.plan || EMPTY);
  map.getSource("footprint")?.setData(m.footprint ? { type: "FeatureCollection", features: [m.footprint] } : EMPTY);
  map.getSource("drone")?.setData(m.drone ? { type: "FeatureCollection", features: [m.drone] } : EMPTY);
  renderChips();
}

// --- live feed (see sightline/api/live.py for the message format) ---------------------------------------
function connectWS() {
  const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`;
  let ws;
  try { ws = new WebSocket(url); } catch { state.wsState = "down"; return; }
  state.ws = ws;
  ws.onopen = () => { state.wsState = "live"; renderChips(); };
  ws.onclose = () => { state.wsState = "down"; renderChips(); setTimeout(connectWS, 3000); };
  ws.onerror = () => { state.wsState = "down"; renderChips(); };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    state.lastSeq = m.seq ?? state.lastSeq;
    if (m.type === "snapshot") { state.records.clear(); (m.records?.features || []).forEach(upsert); renderRecords(); }
    else if (m.type === "record") { upsert(m.feature); renderRecords(); if (state.selected === m.feature.id) openRecord(m.feature.id, true); }
    else if (m.type === "mission") applyMission(m);
    else if (m.type === "coverage") loadCoverage();
    else if (m.type === "outbox") { state.outbox = m; renderChips(); }
    else if (m.type === "control") applyControl(m);
  };
}

// --- F3 pilot HUD ---------------------------------------------------------------------------------------
// Fed by the "control" WebSocket message (sightline/api/control_feed.py). Everything below is presentation:
// the HUD never commands anything, and there is no control path from this page to the aircraft. A judge
// flies with the pad; this is the window they and the room watch while they do it.
const hud = {
  el: document.getElementById("hud"),
  mode: document.getElementById("hud-mode"),
  who: document.getElementById("hud-who"),
  ring: document.getElementById("hud-ring"),
  count: document.getElementById("hud-count"),
  btns: document.getElementById("hud-btns"),
  flight: document.getElementById("hud-flight"),
  env: document.getElementById("hud-env"),
  feed: document.getElementById("hud-feed"),
  stickL: document.getElementById("stick-l"),
  stickR: document.getElementById("stick-r"),
  flash: document.getElementById("takeover"),
  events: [],
  lastMode: null,
  seq: 0,
};

const RING_LEN = 2 * Math.PI * 16;   // matches stroke-dasharray in the markup

function hudStick(box, x, y) {
  // x and y are -1..1 with +x right and +y UP, which is how a person describes a stick. The dot is placed
  // in CSS percentages so the widget can be resized without touching this.
  const dot = box.querySelector("i");
  dot.style.left = `${50 + Math.max(-1, Math.min(1, x)) * 42}%`;
  dot.style.top = `${50 - Math.max(-1, Math.min(1, y)) * 42}%`;
  box.classList.toggle("idle", Math.hypot(x, y) < 0.06);
}

function applyControl(c) {
  state.control = c;
  hud.el.classList.add("on");
  const mode = c.mode || "AUTO";
  hud.el.classList.toggle("manual", mode === "MANUAL");
  hud.mode.className = `hud-mode m-${mode}`;
  hud.mode.textContent = mode;

  // Who is flying, and can we trust the buttons?
  const pad = c.pad || {};
  const verified = pad.verified === true;
  const padName = pad.device || pad.source || "no controller";
  // "No controller" means two completely different things depending on the mode, and saying the wrong one
  // is worse than saying nothing: in AUTO it is the normal resting state, but in MANUAL it means the pilot
  // has put the pad down mid-flight and the only thing that will recover the aircraft is the idle timer.
  hud.who.innerHTML = pad.attached
    ? `<b>${escapeHtml(padName)}</b><br>${verified
        ? "mapping measured"
        : `<span style="color:var(--warn)">buttons unverified</span>`}`
    : (mode === "MANUAL" || mode === "HOLD")
      ? `<b style="color:var(--warn)">controller lost</b><br>` +
        `<span style="color:var(--dim)">${escapeHtml(padName)} stopped reporting — handing back</span>`
      : `<span style="color:var(--dim)">no controller — the mission is flying itself</span>`;

  // The idle-hand-back countdown. Shown only while it can actually fire, so it never sits at a frozen 0.
  const rem = c.idle_remaining_s, total = c.idle_resume_s || 0;
  if (rem === null || rem === undefined || total <= 0) {
    hud.ring.hidden = true;
  } else {
    hud.ring.hidden = false;
    const frac = Math.max(0, Math.min(1, rem / total));
    hud.ring.querySelector(".fg").style.strokeDashoffset = String(RING_LEN * (1 - frac));
    hud.ring.classList.toggle("soon", rem <= 4);
    hud.count.textContent = String(Math.ceil(rem));
    hud.count.title = `hands back to AUTO in ${rem.toFixed(1)} s of no input`;
  }

  const st = c.sticks || {};
  // throttle arrives 0..1 centred at 0.5; the widget wants -1..1.
  hudStick(hud.stickL, st.yaw ?? 0, ((st.throttle ?? 0.5) - 0.5) * 2);
  hudStick(hud.stickR, st.roll ?? 0, st.pitch ?? 0);

  const order = ["takeover", "resume", "hold", "rtl", "mark", "boost", "orbit", "freefly", "camera"];
  const b = c.buttons || {};
  hud.btns.innerHTML = order.filter((k) => k in b)
    .map((k) => `<span class="btn ${b[k] ? "on" : ""}">${k}</span>`).join("")
    || `<span class="btn warn">no buttons reported</span>`;

  const f = c.flight || {}, s2 = c.stats || {};
  const bits = [];
  if (f.agl_m !== null && f.agl_m !== undefined) bits.push(`${fmt(f.agl_m, 0)} m AGL`);
  if (f.boost) bits.push(`<b style="color:var(--manual)">BOOST</b>`);
  if (f.orbit) bits.push(`<b style="color:#c77dff">ORBIT</b>`);
  if (c.free_flight) bits.push(`<b style="color:var(--manual)">FREE FLIGHT</b>`);
  if (f.manual_mode === "rc") bits.push(`<b style="color:var(--warn)">RC passthrough</b>`);
  if (s2.marks) bits.push(`${s2.marks} mark${s2.marks === 1 ? "" : "s"}`);
  const sbm = s2.seconds_by_mode || {};
  if (sbm.MANUAL) bits.push(`${fmt(sbm.MANUAL, 0)} s flown by hand`);
  hud.flight.innerHTML = bits.join(" · ");

  const env = c.envelope || {};
  hud.env.classList.toggle("on", !!env.any);
  if (env.any) hud.env.textContent = (env.reasons || []).join(" · ") || "held by the flight envelope";

  if (c.marks && map.getSource("marks")) map.getSource("marks").setData(c.marks);

  for (const ev of (c.events || [])) {
    if (ev.seq <= hud.seq) continue;
    hud.seq = ev.seq;
    hud.events.push(ev);
  }
  if (hud.events.length > 60) hud.events = hud.events.slice(-60);
  hud.feed.innerHTML = hud.events.slice().reverse().map((ev) => {
    const t = new Date((ev.t_utc || 0) * 1000).toLocaleTimeString([], { hour12: false });
    return `<div class="ev ev-${escapeHtml(ev.kind || "note")}"><span class="k"></span>` +
           `<span class="t">${t}</span><span class="x">${escapeHtml(ev.text || "")}` +
           (ev.detail ? ` <span class="d">${escapeHtml(ev.detail)}</span>` : "") + `</span></div>`;
  }).join("");

  if (mode !== hud.lastMode) {
    if (hud.lastMode !== null) flashMode(hud.lastMode, mode);
    hud.lastMode = mode;
    renderChips();
  }
}

function flashMode(from, to) {
  const text = to === "MANUAL" ? "JUDGE HAS CONTROL"
    : (from === "MANUAL" && to === "AUTO") ? "MISSION RESUMED"
    : to === "RTL" ? "RETURNING TO LAUNCH"
    : to === "HOLD" ? "HOLDING POSITION" : `${from} → ${to}`;
  hud.flash.textContent = text;
  hud.flash.classList.add("show");
  clearTimeout(hud._flashT);
  hud._flashT = setTimeout(() => hud.flash.classList.remove("show"), 2200);
}

function escapeHtml(x) {
  return String(x).replace(/[&<>"']/g, (ch) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}

// --- the operator's camera view -----------------------------------------------------------------------
// Polls the LATEST annotated frame rather than streaming: a stream can fall behind the aircraft, and the
// question this answers is "what is it looking at NOW". The image is cache-busted per poll because the URL
// is constant while the bytes change every frame. 404 simply means nothing is flying, which is not an error.
let cameraHidden = false;
async function pollCamera() {
  const box = document.getElementById("camera");
  const img = document.getElementById("camera-img");
  const meta = document.getElementById("camera-meta");
  try {
    const r = await fetch("/api/live/view.json", { cache: "no-store" });
    if (!r.ok) { box.hidden = true; state.view = null; renderMetrics(); return; }
    const v = await r.json();
    // Frame rate is MEASURED here, not assumed: the loop is latency-bound and its real rate is the
    // number every timing claim on this page depends on.
    if (state.view && v.frame_idx > state.view.frame_idx) {
      const dt = (performance.now() - state.viewAt) / 1000;
      const df = v.frame_idx - state.view.frame_idx;
      if (dt > 0.05) state.fps = 0.7 * (state.fps || df / dt) + 0.3 * (df / dt);
    }
    if (!state.view || v.frame_idx !== state.view.frame_idx) state.viewAt = performance.now();
    state.view = v;
    renderMetrics();
    box.hidden = false;
    if (!cameraHidden) img.src = "/api/live/view.jpg?t=" + Date.now();
    const n = (v.detections || []).length;
    // 8 s is roughly four frames at the measured loop rate: beyond that the picture is not what the
    // aircraft is looking at now, and the panel must stop implying that it is.
    const stale = v.age_s > 8;
    box.classList.toggle("stale", stale);
    meta.textContent = stale
      ? `frame ${v.frame_idx} · ${Math.round(v.age_s)}s old · nothing is flying`
      : `f${v.frame_idx} · ${n} det · ${Math.round(v.agl_m)} m · ${v.mode || ""}` +
        (v.detect_ms ? ` · ${Math.round(v.detect_ms)} ms` : "");
  } catch { box.hidden = true; }
}
document.getElementById("camera-toggle").addEventListener("click", () => {
  const box = document.getElementById("camera");
  cameraHidden = !cameraHidden;
  box.classList.toggle("collapsed", cameraHidden);
  document.getElementById("camera-toggle").textContent = cameraHidden ? "+" : "−";
});
setInterval(pollCamera, 1000);
pollCamera();
pollHealth();

async function pollHealth() {
  try {
    const h = await (await fetch("/health", { cache: "no-store" })).json();
    state.seeded = !!h.seeded;
    renderChips();
  } catch { /* the badge simply stays off */ }
}

async function pollOutbox() {
  try {
    const r = await fetch("/api/outbox");
    if (r.ok) { state.outbox = await r.json(); renderChips(); }
  } catch { /* offline is a normal state here */ }
}

// --- side panel ----------------------------------------------------------------------------------------
function pill(status) { return `<span class="status-pill st-${status}">${status}</span>`; }
function fmt(n, d = 2) { return (n === null || n === undefined) ? "—" : Number(n).toFixed(d); }

function renderChips() {
  const feats = [...state.records.values()];
  const by = (s) => feats.filter((f) => f.properties.status === s).length;
  const ob = state.outbox;
  const live = state.wsState === "live";
  const parts = [
    `<span class="chip ${live ? "live" : "down"}"><b>${live ? "LIVE" : "NO FEED"}</b> ws</span>`,
    `<span class="chip"><b>${feats.length}</b> records</span>`,
    `<span class="chip"><b>${by("confirmed")}</b> confirmed</span>`,
    `<span class="chip"><b>${by("candidate")}</b> candidate</span>`,
    `<span class="chip"><b>${by("dismissed")}</b> dismissed</span>`,
  ];
  if (ob) parts.push(`<span class="chip ${ob.online === false ? "down" : ""}">outbox <b>${ob.depth ?? 0}</b>${ob.online === false ? " · link down" : ""}</span>`);
  const cl = covLayerEntry();
  if (cl) {
    const s = cl.stats || {};
    parts.push(`<span class="chip">POD <b>${cl.layer}</b> mean <b>${fmt(s.mean_pod)}</b> · ≥0.5 in <b>${s["cells_pod_ge_0.5"] ?? "—"}</b> cells</span>`);
    parts.push(`<span class="chip ${cl.k_is_measured ? "" : "sim"}">k ${cl.k === null ? "n/a" : fmt(cl.k, 2)} · <b>${cl.k_is_measured ? "measured" : "MODELLED"}</b></span>`);
    if (state.cannotClear) parts.push(`<span class="chip down"><b>${state.cannotClear}</b> cannot-clear areas</span>`);
  }
  const cmode = state.control?.mode;
  if (cmode) {
    const cls = cmode === "MANUAL" ? "sim" : cmode === "AUTO" ? "live" : "";
    parts.push(`<span class="chip ${cls}">mode <b>${cmode}</b>${state.control.free_flight ? " · FREE" : ""}</span>`);
  } else if (state.mission?.drone) {
    parts.push(`<span class="chip">mode <b>${state.mission.drone.properties.mode}</b></span>`);
  }
  if (state.mission?.drone) parts.push(`<span class="chip">${fmt(state.mission.drone.properties.agl_m, 0)} m AGL</span>`);
  if (state.domain === "sim") parts.push(`<span class="chip sim"><b>SIM</b> simulated data</span>`);
  // The honest label. Seeded fixtures and live finds are indistinguishable on a map, so if any of these
  // records were pre-loaded the page says so rather than letting them pass as the aircraft's work.
  if (state.seeded) parts.push(`<span class="chip down"><b>SEEDED</b> demo fixtures, not live finds</span>`);
  chipsEl.innerHTML = parts.join("");
  renderMetrics();
}

function renderList(feats) {
  const sorted = [...feats].sort((a, b) => {
    const ra = a.properties.priority_rank, rb = b.properties.priority_rank;
    const ka = ra < 0 ? 1e9 : ra, kb = rb < 0 ? 1e9 : rb;
    return ka - kb;
  });
  paneRecs.innerHTML = sorted.map((f) => {
    const p = f.properties, c = p.score_components || {}, dis = p.status === "dismissed";
    const col = dis ? DISMISSED : (CLASS_COLOR[p.cls] || CLASS_COLOR.human);
    const terms = [["p_living", c.p_living, "#e63946"], ["w_class", c.w_class, "#f2a65a"],
                   ["urgency", c.urgency / 2.5, "#8ac6d1"], ["count", (c.count_bonus - 1) * 5, "#9d8df1"]];
    const bars = terms.map(([, v, cc]) =>
      `<i style="flex:${Math.max(0.02, Math.min(1, v || 0))};background:${cc}"></i>`).join("");
    return `<div class="rec ${dis ? "dismissed" : ""} ${state.selected === f.id ? "sel" : ""}" data-id="${f.id}">
      <div class="rec-top">
        <span class="rank" style="background:${col}">${p.priority_rank < 0 ? "?" : p.priority_rank}</span>
        <span>
          <span class="rec-id" title="${f.id}">${String(f.id).slice(0, 8)}</span> ${pill(p.status)}<br>
          <span class="rec-sub">${p.cls} · ${c.urgency_class || "unknown"} · ${p.count_estimate}× · ±${fmt(p.h_acc_m, 1)} m</span>
        </span>
        <span class="grow"></span>
        <span style="text-align:right"><b>${fmt(p.score, 2)}</b><br><span class="rec-sub">score</span></span>
      </div>
      <div class="bars">${bars}</div>
      <div class="why">
        <span>P(living) <b>${fmt(c.p_living)}</b></span><span>w_class <b>${fmt(c.w_class)}</b></span>
        <span>urgency <b>${fmt(c.urgency)}</b></span><span>count× <b>${fmt(c.count_bonus)}</b></span>
        <span>${p.thermal_hot ? "thermal ✓" : "thermal ✗"}</span><span>${p.motion_state}</span>
      </div>
    </div>`;
  }).join("") || `<p style="color:var(--dim)">No records yet.</p>`;
  paneRecs.querySelectorAll(".rec").forEach((el) =>
    el.addEventListener("click", () => openRecord(el.dataset.id, false, true)));
}

let popup = null;
function openRecord(id, keepView = false, fly = false) {
  const f = state.records.get(id);
  if (!f) return;
  state.selected = id;
  const p = f.properties, c = p.score_components || {}, ev = (p.evidence || [])[0];
  const col = p.status === "dismissed" ? DISMISSED : (CLASS_COLOR[p.cls] || CLASS_COLOR.human);
  const el = document.createElement("div");
  el.className = "pop";
  el.innerHTML = `
    ${ev?.thumb_uri ? `<img src="${ev.thumb_uri}" alt="evidence crop">` : ""}
    <div class="pop-body">
      <h2><span class="rank" style="background:${col};min-width:22px;height:22px">${p.priority_rank < 0 ? "?" : p.priority_rank}</span>
          ${f.id} ${pill(p.status)}</h2>
      <div class="rec-sub">${p.cls} · ${c.urgency_class || "unknown"} · ${p.posture} · ${p.submersion}${p.posture_promoted ? " · posture-promoted" : ""}</div>
      <table class="sc">
        <tr><th>P(living | record)</th><td>${fmt(c.p_living, 3)}</td></tr>
        <tr><th>w_class(t) &nbsp;<span class="rec-sub">t+${fmt(c.elapsed_h, 1)} h</span></th><td>× ${fmt(c.w_class, 3)}</td></tr>
        <tr><th>urgency_class</th><td>× ${fmt(c.urgency, 3)}</td></tr>
        <tr><th>1 + 0.1·count &nbsp;<span class="rec-sub">${p.count_estimate} (${p.count_min}–${p.count_max})</span></th><td>× ${fmt(c.count_bonus, 3)}</td></tr>
        <tr class="tot"><th>priority score</th><td>${fmt(p.score, 3)}</td></tr>
      </table>
      <p class="formula">score = P(living) × w_class(t) × urgency × (1 + 0.1·count)<br>
         thermal boost ${fmt(c.thermal_boost, 2)} · motion boost ${fmt(c.motion_boost, 2)}</p>
      <div class="rec-sub" style="margin:6px 0">±${fmt(p.h_acc_m, 1)} m (1σ) · CE90 ${fmt(p.ce90_m, 1)} m ·
        ${p.n_observations} obs · ${p.thermal_hot ? `thermal ${fmt(p.thermal_c, 1)} °C` : "no thermal"}</div>
      <div class="act">
        <button data-act="confirmed">Confirm</button>
        <button data-act="stale">Mark stale</button>
      </div>
      <div class="act">
        <input id="dismiss-reason" placeholder="reason (required to dismiss)" value="${p.dismissed_reason || ""}">
        <button class="danger" data-act="dismiss">Dismiss</button>
      </div>
      <div class="err" id="act-err"></div>
      <p class="formula">R10: dismissing keeps the record and its history; nothing is ever deleted.</p>
      <details ${p.dismissed_reason ? "open" : ""}><summary class="rec-sub">all fields</summary>
      <dl class="kv">
        <dt>position</dt><dd>${f.geometry.coordinates[1].toFixed(6)}, ${f.geometry.coordinates[0].toFixed(6)}</dd>
        <dt>accuracy</dt><dd>±${fmt(p.h_acc_m, 1)} m (1σ) · CE90 ${fmt(p.ce90_m, 1)} m · ${p.method}</dd>
        <dt>confidence</dt><dd>${fmt(p.confidence, 3)} fused · ${fmt(p.confidence_max_det, 3)} best det</dd>
        <dt>observations</dt><dd>${p.n_observations} in ${p.n_tracks_merged} track(s), passes [${(p.seen_in_passes || []).join(", ")}]</dd>
        <dt>motion</dt><dd>${p.motion_state} · ${fmt(p.motion_displacement_m, 1)} m / ${fmt(p.motion_window_s, 0)} s</dd>
        <dt>thermal</dt><dd>${p.thermal_hot ? `hot ${fmt(p.thermal_c, 1)} °C` : "no thermal agreement"} · ${p.modality}</dd>
        <dt>size</dt><dd>${fmt(p.pixel_size_px, 0)} px · GSD ${fmt(p.gsd_cm_px, 1)} cm/px · occl ${p.occlusion ?? "—"}</dd>
        <dt>version</dt><dd>v${p.version} · ${p.schema_version} · <a href="/api/records/${encodeURIComponent(f.id)}/history" target="_blank">history</a></dd>
        ${ev ? `<dt>evidence</dt><dd>${ev.clip_id} frame ${ev.frame_idx} · conf ${fmt(ev.det_conf, 2)} · ${ev.camera}</dd>` : ""}
        ${p.dismissed_reason ? `<dt>dismissed</dt><dd>${p.dismissed_reason} — ${p.dismissed_by}</dd>` : ""}
        ${p.notes ? `<dt>notes</dt><dd>${p.notes}</dd>` : ""}
      </dl></details>
    </div>`;
  el.querySelectorAll("button[data-act]").forEach((b) =>
    b.addEventListener("click", () => act(id, b.dataset.act, el)));

  popup?.remove();
  popup = new maplibregl.Popup({ closeButton: true, maxWidth: "360px", offset: 14 })
    .setLngLat(f.geometry.coordinates.slice(0, 2)).setDOMContent(el).addTo(map);
  // offset lifts the marker above centre so the popup (score table + R10 controls) has room below it
  if (fly && !keepView) map.flyTo({ center: f.geometry.coordinates.slice(0, 2), zoom: Math.max(map.getZoom(), 15),
                                    offset: [0, -140], speed: 1.4 });
  renderList([...state.records.values()]);
}

async function act(id, what, el) {
  const errEl = el.querySelector("#act-err");
  errEl.textContent = "";
  try {
    let r;
    if (what === "dismiss") {
      const reason = el.querySelector("#dismiss-reason").value.trim();
      if (!reason) { errEl.textContent = "R10: a dismissal needs a reason."; return; }
      r = await fetch(`/api/records/${encodeURIComponent(id)}/dismiss`,
        { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ reason, by: "operator" }) });
    } else {
      r = await fetch(`/api/records/${encodeURIComponent(id)}/status`,
        { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ status: what, actor: "operator" }) });
    }
    const j = await r.json();
    if (!r.ok) { errEl.textContent = j.detail || `HTTP ${r.status}`; return; }
    upsert(j.feature); renderRecords(); openRecord(id, true);
  } catch (e) { errEl.textContent = String(e); }
}

// --- layer panel ---------------------------------------------------------------------------------------
const TOGGLES = [
  ["Search quality (POD)", ["coverage-pod"], true],
  ["Aerial search cannot clear", ["cannot-clear-base", "cannot-clear-fill", "cannot-clear-line"], true],
  ["Triage markers", ["markers", "marker-rank", "acc-ring-fill", "acc-ring-line"], true],
  ["Dismissed records", ["markers-dismissed"], true],
  ["Planned pattern", ["plan-line", "plan-wp"], true],
  ["Flight track", ["track-line"], true],
  ["Camera footprint", ["footprint-fill", "footprint-line"], true],
  ["Drone", ["drone-halo", "drone-dot"], true],
];
function rampCss() {
  const stops = state.coverage?.ramp;
  if (!stops?.length) return "linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)";
  const parts = stops.map((s) => `rgb(${s.rgb.join(",")}) ${(s.pod * 100).toFixed(0)}%`);
  return `linear-gradient(90deg,${parts.join(",")})`;
}

function renderLayerPane() {
  const side = state.coverage, cl = covLayerEntry();
  const presPicker = side?.layers?.length
    ? `<h3>Presentation layer (§5.3b)</h3>` + side.layers.map((l) =>
        `<label class="toggle"><input type="radio" name="covlayer" value="${l.layer}" ${l.layer === state.covLayer ? "checked" : ""}>
           ${l.layer} <span class="rec-sub">mean POD ${fmt(l.stats?.mean_pod)}</span></label>`).join("")
    : "";
  paneLayers.innerHTML = `<h3>Layers</h3>` + TOGGLES.map(([label, ids, on], i) =>
    `<label class="toggle"><input type="checkbox" data-i="${i}" ${on ? "checked" : ""}> ${label}</label>`).join("") +
    presPicker +
    `<div class="legend">
      <h3>Triage markers</h3>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.human}"></span> human — size is priority rank</div>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.animal}"></span> animal</div>
      <div class="lg"><span class="sw" style="background:transparent;border:1.5px solid ${DISMISSED}"></span> dismissed (kept, R10)</div>
      <div class="lg"><span class="sw" style="background:${CLASS_COLOR.human}22;border-color:${CLASS_COLOR.human}"></span> ring = h_acc_m (1σ)</div>
      <h3>Search quality</h3>
      <div class="lg"><span class="ramp" style="background:${rampCss()}"></span></div>
      <div class="lg" style="justify-content:space-between"><span>POD 0</span><span>POD ${side?.bands ? fmt(side.bands[side.bands.length - 2], 2) : "1"}+</span></div>
      <div class="lg">unshaded = never swept · hatched = ${side?.cannot_clear_label || "aerial search cannot clear"}</div>
      ${cl ? `<div class="lg" style="display:block">k = ${cl.k === null ? "n/a (mixture)" : fmt(cl.k, 3)},
        <b style="color:${cl.k_is_measured ? "var(--ok)" : "var(--warn)"}">${cl.k_is_measured ? "measured" : "modelled, NOT measured"}</b><br>
        <span class="rec-sub">${cl.k_basis || ""}</span></div>` : ""}
      ${side?.legend_note ? `<div class="lg" style="display:block"><span class="rec-sub">${side.legend_note}</span></div>` : ""}
      ${side ? `<div class="lg"><span class="rec-sub">domain <b>${side.domain}</b> · ${side.passes?.length || 0} pass(es) · source ${side.source}</span></div>` : ""}
      <h3>Flight</h3>
      <div class="lg"><span class="sw" style="background:#57e08a"></span> AUTO</div>
      <div class="lg"><span class="sw" style="background:#ffb545"></span> MANUAL takeover</div>
      <div class="lg"><span class="sw" style="background:#7fd1ff"></span> planned pattern</div>
      <div class="lg"><span class="sw" style="background:#ffd479"></span> drone + camera footprint</div>
      ${state.mission?.plan ? `<div class="lg"><span class="rec-sub">${state.mission.plan.features?.[0]?.properties?.name || ""}</span></div>` : ""}
    </div>`;
  paneLayers.querySelectorAll("input[data-i]").forEach((cb) => cb.addEventListener("change", () => {
    const ids = TOGGLES[Number(cb.dataset.i)][1];
    ids.forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", cb.checked ? "visible" : "none"));
  }));
  paneLayers.querySelectorAll("input[name=covlayer]").forEach((rb) =>
    rb.addEventListener("change", () => setCoverageLayer(rb.value)));
}
// --- mission control: the live readout and the demo launcher -------------------------------------------
// This used to be a separate page. It is here because the question "is it flying, what is it seeing, and
// how fast" should be answerable without changing page, and because the STOP button has to be reachable
// from wherever the operator is looking when something goes wrong.
//
// Every number below is MEASURED and streamed, never a placeholder: telemetry comes from the flight loop
// over the same WebSocket the map uses, and inference timing from the frame the detector just finished.
function m(k, v, off) {
  return `<div class="metric"><span class="k">${k}</span><span class="v${off ? " off" : ""}">${v}</span></div>`;
}
function renderMetrics() {
  const el = $("metrics");
  if (!el) return;
  const d = state.mission?.drone?.properties || null;
  const v = state.view || null;
  const dash = "—";
  const out = [
    m("Alt AGL", d ? `${Number(d.agl_m).toFixed(0)} m` : dash, !d),
    m("Ground speed", d ? `${Number(d.speed_ms).toFixed(1)} m/s` : dash, !d),
    m("Heading", d ? `${((Number(d.yaw_deg) + 360) % 360).toFixed(0)}°` : dash, !d),
    m("Latitude", d ? Number(d.lat).toFixed(5) : dash, !d),
    m("Longitude", d ? Number(d.lon).toFixed(5) : dash, !d),
    m("Fix err", d && d.h_acc_m != null ? `${Number(d.h_acc_m).toFixed(1)} m` : dash, !d),
    m("Frame", v ? `#${v.frame_idx}` : dash, !v),
    m("Detections", v ? String((v.detections || []).length) : dash, !v),
    m("Records", String(state.records.size)),
    m("Inference", v && v.detect_ms ? `${Math.round(v.detect_ms)} ms` : dash, !(v && v.detect_ms)),
    m("Loop rate", state.fps ? `${state.fps.toFixed(2)} fps` : dash, !state.fps),
    m("Mode", (state.control?.mode || d?.mode || dash)),
  ];
  // The model in use is the single fact that decides whether the timing above is the engine's or
  // PyTorch's, so it gets its own full-width row rather than being truncated into a cell.
  out.push(`<div class="metric wide"><span class="k">Detector</span><span class="v${v && v.detector ? "" : " off"}">${v && v.detector ? v.detector : "not loaded"}</span></div>`);
  el.innerHTML = out.join("");
}

let demoCatalog = [];
function renderDemos(running) {
  const el = $("run-demos");
  if (!el || !demoCatalog.length) return;
  const groups = new Map();
  for (const d of demoCatalog) {
    if (!groups.has(d.group)) groups.set(d.group, []);
    groups.get(d.group).push(d);
  }
  el.innerHTML = [...groups].map(([g, items]) => `<div class="sec">${g}</div>` + items.map((d) => `
    <div class="demo">
      <div>
        <div class="t">${d.title}</div>
        <div class="d">${d.sub}</div>
      </div>
      <div class="go"><button class="runbtn" data-demo="${d.id}" ${running ? "disabled" : ""}>Start</button></div>
    </div>`).join("")).join("");
  for (const b of el.querySelectorAll("button[data-demo]")) {
    b.addEventListener("click", () => startDemo(b.dataset.demo));
  }
}

async function pollPreflight() {
  const el = $("preflight");
  if (!el) return;
  try {
    const r = await fetch("/api/demo/preflight?id=nominal", { cache: "no-store" });
    const j = await r.json();
    el.innerHTML = (j.checks || []).map((c) => `
      <li class="${c.ok ? "ok" : "no"}"><span class="s">${c.ok ? "✓" : "×"}</span>
      <span><b>${c.name}</b> — ${c.detail}</span></li>`).join("");
  } catch {
    el.innerHTML = '<li class="no"><span class="s">×</span><span>could not reach the backend</span></li>';
  }
}

async function startDemo(id) {
  $("run-msg").textContent = "";
  try {
    const r = await fetch("/api/demo/start", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ id }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      $("run-msg").textContent = j.detail || `could not start ${id}`;
      pollPreflight();
      return;
    }
    pollDemo();
  } catch (e) { $("run-msg").textContent = String(e); }
}

async function stopDemo() {
  const b = $("run-stop");
  $("run-msg").textContent = "";
  b.disabled = true; b.textContent = "Stopping…";
  try {
    const r = await fetch("/api/demo/stop", { method: "POST" });
    const j = await r.json().catch(() => ({}));
    if (j.killed !== undefined) $("run-msg").textContent = `Stopped. ${j.killed} process tree(s) terminated.`;
  } catch (e) { $("run-msg").textContent = String(e); }
  b.textContent = "Stop everything";
  pollDemo();
}

async function pollDemo() {
  if ($("pane-run").hidden) return;          // do not poll a pane nobody is looking at
  try {
    const s2 = await (await fetch("/api/demo/status", { cache: "no-store" })).json();
    const running = !!s2.running;
    $("run-stop").disabled = !running;
    renderDemos(running);
    const log = (s2.log || []).join("\n");
    const el = $("run-log");
    el.textContent = log || "Nothing has run yet.";
    if (log) el.scrollTop = el.scrollHeight;
  } catch { /* the server may be restarting; the next tick picks it up */ }
}

(async () => {
  try {
    demoCatalog = (await (await fetch("/api/demo/catalog")).json()).demos || [];
  } catch { /* the Run tab will simply show no demos */ }
  renderDemos(false);
  renderMetrics();
})();
$("run-stop").addEventListener("click", stopDemo);
setInterval(pollDemo, 1500);
setInterval(() => { if (!$("pane-run").hidden) pollPreflight(); }, 6000);

const TABS = [["tab-recs", "pane-recs"], ["tab-layers", "pane-layers"], ["tab-run", "pane-run"]];
function selectTab(id) {
  for (const [t, pane] of TABS) {
    const on = t === id;
    $(pane).hidden = !on;
    $(t).setAttribute("aria-selected", on ? "true" : "false");
  }
  if (id === "tab-run") { pollDemo(); pollPreflight(); }
}
for (const [t] of TABS) $(t).onclick = () => selectTab(t);
// Deep-linkable, so "?tab=run" opens the console on mission control - and so a verification run can
// screenshot the pane it means to check rather than the one that happens to be first.
{
  const want = (QS.get("tab") || "").toLowerCase();
  if (want && TABS.some(([t]) => t === `tab-${want}`)) selectTab(`tab-${want}`);
}

// --- status line + headless self-check ------------------------------------------------------------------
function setStatus(extra = "") {
  statusEl.textContent =
    `records ${state.records.size} · coverage ${state.coverageLoaded ? "on" : "off"} · ws ${state.wsState}` +
    ` · errors ${state.errors.length}${extra ? "\n" + extra : ""}`;
}

let reported = false;
async function selfCheck() {
  if (reported) return;
  reported = true;
  const resources = performance.getEntriesByType("resource").map((r) => r.name);
  const external = resources.filter((u) => !u.startsWith(ORIGIN) && !u.startsWith("blob:") && !u.startsWith("data:"));
  const feats = map.queryRenderedFeatures();
  const bySource = (s) => feats.filter((f) => f.source === s).length;
  const report = {
    ok: false,
    maplibre: maplibregl.getVersion ? maplibregl.getVersion() : "?",
    ms_to_idle: Math.round(performance.now() - T0),
    basemap_features: bySource("protomaps"),
    source_layers: [...new Set(feats.filter((f) => f.source === "protomaps").map((f) => f.sourceLayer))].sort(),
    marker_features: bySource("records"),
    ring_features: bySource("rings"),
    track_features: bySource("track"),
    plan_features: bySource("plan"),
    cannot_clear_features: bySource("cannot-clear"),
    drone_features: bySource("drone"),
    footprint_features: bySource("footprint"),
    coverage_raster_loaded: state.coverageLoaded,
    coverage_source: state.coverage?.source ?? null,
    coverage_layer: state.covLayer,
    coverage_layers: (state.coverage?.layers || []).map((l) => l.layer),
    coverage_pod_mean: covLayerEntry()?.stats?.mean_pod ?? null,
    coverage_k_is_measured: covLayerEntry()?.k_is_measured ?? null,
    cannot_clear_polygons: state.cannotClear,
    plan_waypoints: (state.mission?.plan?.features || []).filter((f) => f.properties.kind === "waypoint").length,
    track_modes: [...new Set((state.mission?.track?.features || []).map((f) => f.properties.mode))].sort(),
    records_loaded: state.records.size,
    ranked_top: [...state.records.values()].filter((f) => f.properties.priority_rank === 1)
      .map((f) => f.id),
    score_components_present: [...state.records.values()].every((f) => f.properties.score_components &&
      typeof f.properties.score_components.p_living === "number"),
    thumbnails_present: [...state.records.values()].filter((f) => (f.properties.evidence || [])[0]?.thumb_uri).length,
    ws_state: state.wsState,
    resource_requests: resources.length,
    external_requests: external,
    errors: state.errors,
  };
  report.ok = report.basemap_features > 0 && report.marker_features > 0 && report.ring_features > 0 &&
              report.track_features > 0 && report.plan_features > 0 && report.drone_features > 0 &&
              report.footprint_features > 0 && report.cannot_clear_features > 0 &&
              report.coverage_raster_loaded && report.cannot_clear_polygons > 0 &&
              report.score_components_present && report.thumbnails_present > 0 &&
              external.length === 0 && state.errors.length === 0;
  setStatus(JSON.stringify({ basemap: report.basemap_features, markers: report.marker_features,
    rings: report.ring_features, track: report.track_features, hatched: report.cannot_clear_features,
    coverage: report.coverage_raster_loaded, ws: report.ws_state, external: external.length }));
  document.title = report.ok ? "MAP_OK" : "MAP_FAIL";
  window.__sightlineReport = report;
  fetch("/__report", { method: "POST", body: JSON.stringify(report) }).catch(() => {});
}

// --- boot ----------------------------------------------------------------------------------------------
map.on("load", async () => {
  addLayers();
  renderLayerPane();
  try { await loadCoverage(); } catch (e) { state.errors.push("coverage: " + e); }
  try { await loadMission(); } catch (e) { state.errors.push("mission: " + e); }
  try { await loadRecords(); } catch (e) { state.errors.push("records: " + e); }
  await pollOutbox();
  renderLayerPane();
  connectWS();
  setInterval(pollOutbox, 5000);
  setStatus();
  if (SELFCHECK) {
    // one idle after the data layers are populated, then judge
    map.once("idle", () => setTimeout(selfCheck, 400));
    setTimeout(selfCheck, 20000); // hard deadline so the check never hangs
  }
});
map.on("idle", () => setStatus());
</script>
